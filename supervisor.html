<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Reading Book</title>
<meta name="theme-color" content="#141A1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Reading Book">
<link rel="manifest" href="manifest-sup.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141A1F;
  --ink-2:#39454F;
  --steel:#6B7A87;
  --line:#D6DDE3;
  --line-2:#EBEFF2;
  --bg:#EDF1F4;
  --surface:#FFFFFF;
  --hivis:#F5B301;
  --hivis-dk:#C08D00;
  --paid:#15784B;
  --paid-bg:#E3F3EA;
  --due:#C0392B;
  --due-bg:#FBE9E7;
  --rent:#2C5F8A;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.45;
  padding-bottom:calc(118px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Barlow Condensed','Barlow',sans-serif;margin:0;font-weight:700;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
button{cursor:pointer}
a{color:var(--rent)}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;
  padding:calc(8px + env(safe-area-inset-top)) 12px 0;
}
.tb-row{display:flex;align-items:center;gap:8px;padding-bottom:8px}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;letter-spacing:.02em;line-height:1;flex:0 0 auto}
.brand span{display:block;font-size:10.5px;font-family:'Barlow',sans-serif;font-weight:500;color:#93A3AF;letter-spacing:.08em;margin-top:2px}
.sitepick{
  flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:6px;justify-content:flex-end;
  background:#222C34;border:1px solid #33414B;border-radius:8px;padding:7px 10px;color:#fff;
}
.sitepick b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.sitepick i{font-style:normal;color:var(--hivis);font-size:11px}
.lockbtn{flex:0 0 auto;background:#222C34;border:1px solid #33414B;color:var(--hivis);border-radius:8px;padding:8px 9px;font-size:10px;font-weight:700;letter-spacing:.06em}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;background:none;border:0;color:#93A3AF;padding:9px 11px 10px;
  font-size:13.5px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;
}
.tab.on{color:#fff;border-bottom-color:var(--hivis)}

/* ---------- layout ---------- */
main{padding:12px 12px 24px;max-width:820px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.card>h3{
  padding:10px 12px;font-size:15px;border-bottom:1px solid var(--line-2);
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.card>h3 small{font-family:'Barlow',sans-serif;font-weight:500;font-size:12px;color:var(--steel)}
.pad{padding:12px}
.muted{color:var(--steel);font-size:13px}
.tiny{font-size:12px;color:var(--steel)}
.right{text-align:right}
.center{text-align:center}
.mt{margin-top:12px}

/* ---------- hero totals ---------- */
.hero{background:var(--ink);color:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px}
.hero .lbl{font-size:11px;letter-spacing:.1em;color:#93A3AF;font-weight:600}
.hero .big{font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:700;line-height:1.05;margin-top:2px}
.hero .big small{font-size:20px;color:var(--hivis);margin-right:4px;font-weight:600}
.hsplit{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:#33414B;border-radius:8px;overflow:hidden;margin-top:12px}
.hsplit div{background:#1C242B;padding:9px 10px;min-width:0}
.hsplit .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsplit .k{font-size:10.5px;color:#93A3AF;font-weight:600;letter-spacing:.04em}
.hsplit .v{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;margin-top:1px}
.pendbar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;background:var(--hivis);color:#241C00;border-radius:8px;padding:9px 12px}
.pendbar b{font-family:'Barlow Condensed',sans-serif;font-size:22px}

/* ---------- kpi grid ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px}
.kpi .k{font-size:11px;color:var(--steel);font-weight:600;letter-spacing:.03em}
.kpi .v{font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:700;margin-top:2px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi{min-width:0}
.kpi.g .v{color:var(--paid)} .kpi.r .v{color:var(--due)} .kpi.b .v{color:var(--rent)}
.k3{grid-template-columns:1fr 1fr 1fr}

/* ---------- tables ---------- */
.scroll{-webkit-overflow-scrolling:touch;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;font-weight:600;font-size:11px;letter-spacing:.04em;color:var(--steel);
  padding:7px 10px;border-bottom:1px solid var(--line);background:#F7F9FA;white-space:nowrap;
}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;background:#F7F9FA;border-top:1px solid var(--line)}
.nowrap{white-space:nowrap}

/* ---------- log rows ---------- */
.row{display:flex;flex-wrap:wrap;gap:8px 10px;padding:11px 12px;border-bottom:1px solid var(--line-2);align-items:center}
.row:last-child{border-bottom:0}
.row .main{flex:1 1 58%;min-width:0}
.row .ttl{font-weight:600;font-size:14.5px;word-break:break-word}
.row .sub{font-size:12px;color:var(--steel);margin-top:2px}
.row .amt{flex:0 0 auto;margin-left:auto;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;letter-spacing:.03em}
.pill.p{background:var(--paid-bg);color:var(--paid)}
.pill.u{background:var(--due-bg);color:var(--due)}
.pill.n{background:#EEF2F5;color:var(--ink-2)}
.rowbtn{flex:0 0 auto;background:#F7F9FA;border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;color:var(--ink-2);font-size:12px;font-weight:600;line-height:1.1}
.rowbtn:active{background:var(--line)}

/* ---------- forms ---------- */
.field{margin-bottom:10px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:.03em;margin-bottom:3px}
.field input,.field select,.field textarea{
  width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--hivis);outline-offset:-1px;border-color:var(--hivis)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;
  padding:12px;border-radius:9px;border:0;background:var(--hivis);color:#241C00;font-weight:700;font-size:15px;
}
.btn:active{background:var(--hivis-dk)}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.dk{background:var(--ink);color:#fff}
.btn.dgr{background:#fff;border:1px solid #E7B7B1;color:var(--due)}
.btn.sm{width:auto;padding:8px 12px;font-size:13.5px}
.btnrow{display:flex;gap:8px;margin-top:8px;align-items:stretch}
.btnrow > .btn{min-width:0}
.f2 > *{min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:#fff;padding:10px 6px;font-size:13.5px;font-weight:600;color:var(--steel)}
.seg button.on{background:var(--ink);color:#fff}
.seg.pu button.on[data-v="Paid"]{background:var(--paid)}
.seg.pu button.on[data-v="Unpaid"]{background:var(--due)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line-2);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(6,1fr);
  background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
.nav button{background:none;border:0;padding:8px 2px 9px;color:var(--steel);font-size:10.5px;font-weight:600;line-height:1.2}
.nav button svg{display:block;margin:0 auto 2px;width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--ink)}
.nav button.on svg{stroke:var(--hivis-dk)}

.nav.n7 button,.nav.n8 button{font-size:9px;padding:7px 0 8px;letter-spacing:-.01em}
.nav.n7 button svg,.nav.n8 button svg{width:18px;height:18px}
.nav button{min-width:0;overflow:hidden}
.logo{height:26px;width:auto;max-width:88px;object-fit:contain;border-radius:4px;background:#fff;padding:2px;flex:0 0 auto}
.logobox{display:flex;align-items:center;gap:8px;flex:0 0 auto}

.prt{position:fixed;inset:0;z-index:100;background:#fff;overflow-y:auto;padding:16px 14px calc(90px + env(safe-area-inset-bottom))}
.prtbar{position:fixed;left:0;right:0;bottom:0;z-index:101;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.bill{max-width:760px;margin:0 auto;color:#000;font-size:12.5px}
.bill h1{font-family:'Barlow Condensed',sans-serif;font-size:22px;margin:0 0 2px}
.bill .meta{font-size:11.5px;color:#333;margin-bottom:12px;line-height:1.6}
.bill table{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:14px}
.bill th{background:#EEF2F5;border:1px solid #B9C4CC;padding:5px 6px;text-align:left;font-size:10.5px;letter-spacing:.03em}
.bill td{border:1px solid #D6DDE3;padding:4px 6px;vertical-align:top}
.bill td.n,.bill th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bill tfoot td{font-weight:700;background:#F5F7F9}
.bill .kpi{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.bill .kpi div{border:1px solid #B9C4CC;border-radius:6px;padding:6px 10px;min-width:100px}
.bill .kpi b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:17px}
.bill .kpi span{font-size:9.5px;letter-spacing:.06em;color:#444}
.bill h2{font-family:'Barlow Condensed',sans-serif;font-size:15px;margin:16px 0 6px;border-bottom:1.5px solid #000;padding-bottom:2px}
.bill .sign{margin-top:26px;display:flex;justify-content:space-between;font-size:11px;color:#333}
@media print{
  body{background:#fff!important;padding:0!important}
  body > *{display:none!important}
  body > #print{display:block!important}
  .prt{position:static;padding:0;overflow:visible}
  .prtbar{display:none!important}
  .bill{max-width:none;font-size:11px}
  @page{margin:12mm}
}

.arow{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface);margin-bottom:7px;touch-action:none;user-select:none}
.arow.drag{background:#FFF7DB;border-color:var(--hivis);box-shadow:0 6px 18px rgba(15,20,25,.16);opacity:.96}
.arow .hnd{width:26px;flex:0 0 26px;color:var(--steel);font-size:17px;line-height:1;text-align:center;cursor:grab}
.arow .anm{flex:1;font-weight:600;font-size:14px}
.arow .asub{font-weight:400;font-size:11px;color:var(--steel);display:block}
.arow .abtn{width:34px;height:32px;flex:0 0 34px;border:1px solid var(--line);border-radius:8px;
  background:#F7F9FA;font-size:14px;color:var(--ink)}

/* ---------- sheet / modal ---------- */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(15,20,25,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{
  background:var(--bg);width:100%;max-width:820px;max-height:92vh;overflow-y:auto;
  border-radius:16px 16px 0 0;padding:14px 12px calc(20px + env(safe-area-inset-bottom));
}
.sheet h3{font-size:18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--steel);padding:0 4px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:90;
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:13.5px;font-weight:600;
  box-shadow:0 6px 20px rgba(15,20,25,.3);
}
.empty{padding:26px 16px;text-align:center;color:var(--steel);font-size:13.5px}
.warn{background:#FFF8E1;border:1px solid #F0D48A;color:#6B5300;padding:10px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px}
.bar{height:5px;background:var(--line-2);border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--rent)}
.lockwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px;background:var(--ink)}
.lock{width:100%;max-width:380px;color:#fff}
.lock .lg{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;line-height:1.1}
.lock .sm2{color:#93A3AF;font-size:13px;margin-top:6px;line-height:1.6}
.lock input{width:100%;padding:14px;border-radius:10px;border:1px solid #33414B;background:#1C242B;color:#fff;font-size:18px;letter-spacing:.25em;text-align:center;margin-top:14px}
.lock input::placeholder{letter-spacing:normal;color:#5C6B77}
.lock .btn{margin-top:12px}
.lock .err{background:#3A1D1A;border:1px solid #6B2C24;color:#FFB4A8;padding:9px 12px;border-radius:8px;font-size:12.5px;margin-top:12px}
.lock .skip{display:block;text-align:center;color:#93A3AF;font-size:12.5px;margin-top:16px;text-decoration:underline}
.lockbtn{flex:0 0 auto;background:#222C34;border:1px solid #33414B;border-radius:8px;color:#93A3AF;padding:7px 9px;font-size:15px;line-height:1}
.robar{background:var(--rent);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:5px 12px;text-align:center}
/* fakt baghnyachya mode madhe: badal karnyache buttons lapavaayche,
   pan entries chya rows disaylach havyat */
body.ro button[data-act$="Add"],body.ro button[data-act="xlAllDone"],body.ro button[data-act="xlReset"],
body.ro button[data-act="impJson"],body.ro button[data-act="snapList"],body.ro button[data-act="snapBack"],
body.ro button[data-act="xlCopy"],body.ro button[data-act="siteEdit"],body.ro .rowbtn{display:none !important}
/* English var, Hindi khali */

h3 i{font-family:'Barlow',sans-serif;font-weight:500}
.hero .lbl i,.hsplit .k i{color:#7C8B98}
.btn i{color:rgba(36,28,0,.62);font-size:10px}
.btn.dk i,.btn.sec i,.btn.dgr i{color:var(--steel)}
.tab i{font-size:9.5px;color:#6B7A87}
.seg button i{display:block;font-style:normal;font-size:9.5px;font-weight:500;color:var(--steel)}
.seg button.on i{color:rgba(255,255,255,.7)}
.searchwrap{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:45;
  background:var(--surface);border-top:1px solid var(--line);padding:7px 10px;display:flex;gap:8px;align-items:center}
.searchwrap input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:99px;background:#F4F7F9;font-size:15px}
.searchwrap input:focus{outline:2px solid var(--hivis);outline-offset:-1px;background:#fff}
.searchwrap button{flex:0 0 auto;background:none;border:0;color:var(--steel);font-size:13px;font-weight:700;padding:6px 8px}
.spanel{position:fixed;left:0;right:0;top:0;bottom:calc(112px + env(safe-area-inset-bottom));z-index:44;
  background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 20px}
.shead{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--steel);padding:10px 2px 6px}
.brandlogo{height:30px;max-width:130px;object-fit:contain;display:block}
@media (min-width:640px){ .kpis{grid-template-columns:repeat(4,1fr)} .k3{grid-template-columns:repeat(3,1fr)} }
@media (prefers-reduced-motion:no-preference){ .sheet .box{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px)}} }
</style>

<body>
<div id="app"></div>
<div id="toast"></div>
<script>
/* ============================================================
   SITE READING BOOK  —  supervisor data entry app
   Machine hour readings + diesel purchases
   ============================================================ */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => {
  if (typeof v === 'string') v = v.replace(/[,\s\u20B9]/g, '');
  const n = parseFloat(v);
  return isFinite(n) ? n : 0;
};
const has = v => v !== '' && v != null && !(typeof v === 'number' && isNaN(v));
const today = () => new Date().toISOString().slice(0, 10);
const shiftDay = (d, n) => { const t = new Date(d + 'T12:00:00'); t.setDate(t.getDate() + n); return t.toISOString().slice(0, 10); };
const dec = (v, d = 1) => { const n = num(v); return (Math.round(n * 10 ** d) / 10 ** d).toLocaleString('en-IN'); };
const money = v => '\u20B9' + Math.round(num(v)).toLocaleString('en-IN');
const fmtDate = d => { if (!d) return '—'; const p = String(d).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0].slice(2) : d; };
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const dayName = d => { try { return DAYS[new Date(d + 'T12:00:00').getDay()]; } catch (e) { return ''; } };

function toast(msg) {
  const t = $('#toast');
  t.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.innerHTML = '', 2200);
}

/* ---------- storage ---------- */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const rq = indexedDB.open('vsup', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
      rq.onsuccess = () => { this.db = rq.result; res(this.db); };
      rq.onerror = () => rej(rq.error);
    });
  },
  async tx(m) { const db = await this.open(); return db.transaction('kv', m).objectStore('kv'); },
  async get(k) { const s = await this.tx('readonly'); return new Promise((res, rej) => { const r = s.get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async set(k, v) { const s = await this.tx('readwrite'); return new Promise((res, rej) => { const r = s.put(v, k); r.onsuccess = () => res(1); r.onerror = () => rej(r.error); }); }
};
const SUP_VERSION = 'v7 · 06-09-2026';
const KEY = 'vsup:db:v1';
let STORAGE_OK = true;

let DB = { site: '', supervisor: '', machines: [], pumps: [], people: [], days: {}, diesel: [], sent: {}, auth: null };
let ME = null;                                   /* logged in supervisor */

async function sha(txt) {
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(txt)));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 5381; const t = String(txt);
    for (let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0;
    return 'f' + h.toString(16);
  }
}
const norm = s => String(s || '').trim().toLowerCase();
const hasLogin = () => !!(DB.auth && DB.auth.users && DB.auth.users.length);
async function checkLogin(id, pw) {
  if (!hasLogin()) return null;
  const h = await sha(pw + ':' + (DB.auth.salt || 'vsup'));
  return DB.auth.users.find(u => norm(u.userId) === norm(id) && u.hash === h) || null;
}
function loadSession() { try { ME = JSON.parse(localStorage.getItem('vsup:me') || 'null'); } catch (e) { } }
function saveSession() { try { if (ME) localStorage.setItem('vsup:me', JSON.stringify(ME)); else localStorage.removeItem('vsup:me'); } catch (e) { } }

async function loadDB() {
  let v = null;
  try { v = await IDB.get(KEY); } catch (e) { STORAGE_OK = false; }
  if (v == null) { try { v = localStorage.getItem(KEY); } catch (e) { } }
  if (v) { try { DB = JSON.parse(v); } catch (e) { } }
  ['machines', 'pumps', 'people', 'diesel'].forEach(k => { if (!Array.isArray(DB[k])) DB[k] = []; });
  if (!DB.days) DB.days = {};
  if (!DB.sent) DB.sent = {};
  loadSession();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) { }
}

async function snapshot(json) {
  try {
    await IDB.set('snap:' + today(), json);
    const keys = await new Promise(res => { IDB.tx('readonly').then(st => { const r = st.getAllKeys(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); }); });
    const snaps = keys.filter(k => String(k).startsWith('snap:')).sort();
    while (snaps.length > 21) {
      const k = snaps.shift();
      const st = await IDB.tx('readwrite'); st.delete(k);
    }
  } catch (e) { }
}

let saveT = null;
function save() {
  clearTimeout(saveT);
  return new Promise(res => {
    saveT = setTimeout(async () => {
      const snapNeeded = DB.lastSnap !== today();
      if (snapNeeded) DB.lastSnap = today();          /* stringify chya aadhi */
      const json = JSON.stringify(DB);
      try { await IDB.set(KEY, json); STORAGE_OK = true; } catch (e) { STORAGE_OK = false; }
      try { localStorage.setItem(KEY, json); } catch (e) { }
      if (snapNeeded) await snapshot(json);
      res();
    }, 100);
  });
}

/* ---------- machines ---------- */
const TYPES = ['Poclain', 'JCB', 'Hiwa', 'Tractor', 'Bulldozer', 'Roller'];
const DAILY_TYPES = ['Hiwa'];                  /* no hour meter — counted per day */
const isDaily = t => DAILY_TYPES.indexOf(t) >= 0;

const dayRows = d => (DB.days[d] && DB.days[d].rows) || {};
const rowOf = (d, no) => dayRows(d)[no] || {};

function lastOut(no, beforeDay) {
  const ds = Object.keys(DB.days).filter(d => d < beforeDay).sort().reverse();
  for (const d of ds) {
    const r = dayRows(d)[no];
    if (r && has(r.out)) return { v: num(r.out), day: d };
  }
  return null;
}
const hoursOf = r => (has(r.in) && has(r.out)) ? num(r.out) - num(r.in) : 0;
const filled = r => !!(r && (has(r.in) || has(r.out) || has(r.diesel) || r.worked || (r.remark || '').trim()));
const machineCount = d => Object.values(dayRows(d)).filter(filled).length;
const dieselOn = d => DB.diesel.filter(x => x.date === d);
const dayHasData = d => machineCount(d) > 0 || dieselOn(d).length > 0;

function totals(days) {
  let hrs = 0, dsl = 0, entries = 0, litres = 0, amount = 0, bills = 0;
  days.forEach(d => {
    Object.values(dayRows(d)).forEach(r => { if (!filled(r)) return; entries++; hrs += hoursOf(r); dsl += num(r.diesel); });
    dieselOn(d).forEach(x => { bills++; litres += num(x.litres); amount += num(x.amount); });
  });
  return { hrs, dsl, entries, litres, amount, bills };
}

/* ---------- sent tracking ---------- */
const isSent = d => !!DB.sent[d];
const allDays = () => [...new Set(Object.keys(DB.days).concat(DB.diesel.map(x => x.date)))].filter(d => d && dayHasData(d)).sort().reverse();
const unsentDays = () => allDays().filter(d => !isSent(d)).sort();
function markSent(days) { days.forEach(d => DB.sent[d] = today()); }
function sendDays() {
  const scope = UI.scope || 'unsent';
  return scope === 'unsent' ? unsentDays() : scope === 'day' ? [DAY].filter(dayHasData) : allDays().slice().sort();
}
const touched = d => { if (DB.sent[d]) delete DB.sent[d]; };

/* ---------- rows for export ---------- */
function machineRows(days) {
  const out = [];
  days.slice().sort().forEach(d => {
    DB.machines.forEach(m => {
      const r = rowOf(d, m.no);
      if (!filled(r)) return;
      out.push({
        date: d, machineNo: m.no, type: m.type,
        inR: isDaily(m.type) ? '' : (has(r.in) ? num(r.in) : ''),
        outR: isDaily(m.type) ? '' : (has(r.out) ? num(r.out) : ''),
        diesel: has(r.diesel) ? num(r.diesel) : '',
        remark: (r.remark || '') + (isDaily(m.type) && r.worked ? (r.remark ? ' | ' : '') + 'worked' : '')
      });
    });
  });
  return out;
}
function dieselRows(days) {
  const set = new Set(days);
  return DB.diesel.filter(x => set.has(x.date)).slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).map(x => ({
    date: x.date, vendor: x.vendor || '', litres: has(x.litres) ? num(x.litres) : '', bill: x.bill || '',
    amount: has(x.amount) ? num(x.amount) : '', status: x.status || 'Unpaid', paidBy: x.paidBy || '', remark: x.remark || ''
  }));
}

/* ---------- browser chya naav suggestions band ---------- */
function noSuggest(root) {
  try {
    (root || document).querySelectorAll('input, textarea').forEach(el => {
      const t = (el.type || 'text').toLowerCase();
      if (t === 'date' || t === 'checkbox' || t === 'radio') return;
      el.setAttribute('autocomplete', 'off');
      el.setAttribute('autocorrect', 'off');
      el.setAttribute('spellcheck', 'false');
      if (!el.name) el.name = 'f' + Math.random().toString(36).slice(2, 8);
    });
  } catch (e) { }
}

/* ---------------- WhatsApp text ---------------- */
function waText(days) {
  const L = [];
  L.push('*' + (DB.site || 'SITE') + ' — DAILY REPORT*');
  if (DB.supervisor) L.push('Supervisor: ' + DB.supervisor);
  days.forEach(d => {
    L.push('');
    L.push('*' + fmtDate(d) + ' (' + dayName(d) + ')*');
    let any = false;
    DB.machines.forEach(m => {
      const r = rowOf(d, m.no);
      if (!filled(r)) return;
      any = true;
      if (isDaily(m.type)) {
        L.push(m.no + ' - ' + (r.worked ? 'worked' : 'no work') + (has(r.diesel) ? ', diesel ' + dec(r.diesel) + ' L' : '') + (r.remark ? ' (' + r.remark + ')' : ''));
      } else {
        L.push(m.no + ' - ' + (has(r.in) ? dec(r.in, 1) : '?') + ' to ' + (has(r.out) ? dec(r.out, 1) : '?') + ' = ' + dec(hoursOf(r), 1) + ' hr' + (has(r.diesel) ? ', diesel ' + dec(r.diesel) + ' L' : '') + (r.remark ? ' (' + r.remark + ')' : ''));
      }
    });
    const dl = dieselOn(d);
    if (dl.length) {
      L.push('Diesel purchase:');
      dl.forEach(x => L.push('  ' + (x.vendor || '-') + ' ' + dec(x.litres) + ' L - ' + money(x.amount) + ' (' + (x.status || 'Unpaid') + (x.paidBy ? ', ' + x.paidBy : '') + ')'));
      any = true;
    }
    if (!any) L.push('(nothing recorded)');
    const x = totals([d]);
    L.push('Total: ' + dec(x.hrs) + ' hr, ' + dec(x.dsl) + ' L used' + (x.bills ? ', ' + dec(x.litres) + ' L purchased ' + money(x.amount) : ''));
  });
  return L.join('\n');
}

/* ---------- zip (store, no compression) ---------- */
const CRC_T = (() => { const t = new Int32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c; } return t; })();
function crc32(b) { let c = -1; for (let i = 0; i < b.length; i++) c = (c >>> 8) ^ CRC_T[(c ^ b[i]) & 0xFF]; return (c ^ -1) >>> 0; }
const ENC = new TextEncoder();

function zipStore(files) {
  const parts = [], central = [];
  let off = 0;
  files.forEach(f => {
    const name = ENC.encode(f.name), data = f.data, crc = crc32(data);
    const lh = new Uint8Array(30 + name.length), dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0x2821, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true);
    dv.setUint16(26, name.length, true); dv.setUint16(28, 0, true);
    lh.set(name, 30);
    parts.push(lh, data);
    const ch = new Uint8Array(46 + name.length), cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0x2821, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
    cv.setUint16(28, name.length, true); cv.setUint32(42, off, true);
    ch.set(name, 46);
    central.push(ch);
    off += lh.length + data.length;
  });
  const cdSize = central.reduce((a, c) => a + c.length, 0);
  const end = new Uint8Array(22), ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, off, true);
  const all = parts.concat(central, [end]);
  const total = all.reduce((a, p) => a + p.length, 0);
  const out = new Uint8Array(total);
  let p = 0; all.forEach(x => { out.set(x, p); p += x.length; });
  return out;
}

/* ---------- xml helpers ---------- */
const X = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function colL(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; }
function serial(d) { const p = String(d).split('-'); if (p.length !== 3) return null; return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000) + 25569; }

const D_ = (v, s) => { const x = serial(v); return x == null ? T(v, s == null ? SY.date : s) : { t: 'n', v: x, s: s == null ? SY.date : s }; };

function sheetXml(sh) {
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  x += '<sheetViews><sheetView workbookViewId="0" showGridLines="0"';
  x += (sh.tabSelected ? ' tabSelected="1"' : '') + '>';
  if (sh.freeze) x += `<pane ySplit="${sh.freeze}" topLeftCell="A${sh.freeze + 1}" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft"/>`;
  x += '</sheetView></sheetViews><sheetFormatPr defaultRowHeight="16"/>';
  if (sh.cols && sh.cols.length) {
    x += '<cols>' + sh.cols.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('') + '</cols>';
  }
  x += '<sheetData>';
  sh.rows.forEach((row, ri) => {
    if (!row) return;
    const r = ri + 1;
    const cells = row.map((c, ci) => {
      if (c == null) return '';
      const ref = colL(ci + 1) + r;
      const s = c.s ? ` s="${c.s}"` : '';
      if (c.t === 'f') return `<c r="${ref}"${s}><f>${X(c.f)}</f></c>`;
      if (c.t === 'n') return `<c r="${ref}"${s}><v>${c.v}</v></c>`;
      if (c.v === '' || c.v == null) return `<c r="${ref}"${s}/>`;
      return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${X(c.v)}</t></is></c>`;
    }).join('');
    if (!cells) return;
    const ht = sh.heights && sh.heights[r] ? ` ht="${sh.heights[r]}" customHeight="1"` : '';
    x += `<row r="${r}"${ht}>${cells}</row>`;
  });
  x += '</sheetData>';
  if (sh.merges && sh.merges.length) x += `<mergeCells count="${sh.merges.length}">` + sh.merges.map(m => `<mergeCell ref="${m}"/>`).join('') + '</mergeCells>';
  if (sh.dv && sh.dv.length) x += `<dataValidations count="${sh.dv.length}">` + sh.dv.map(d => `<dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1" sqref="${d.sq}"><formula1>${X(d.f)}</formula1></dataValidation>`).join('') + '</dataValidations>';
  x += '<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/></worksheet>';
  return x;
}

const SUMR = (col, a, b) => b >= a ? `SUM($${col}$${a}:$${col}$${b})` : '0';

/* ---------- workbook: Machine Log + Diesel Purchase ---------- */
function supSheets(mRows, dRows) {
  const sheets = [];
  const head = (name, cols) => [[T((DB.site || 'Site') + '  \u2014  ' + name + (DB.supervisor ? '  (' + DB.supervisor + ')' : ''), SY.title)], cols.map(c => T(c, SY.col))];

  const M = head('Machine Log', ['Date', 'Machine No', 'Machine Type', 'In Reading', 'Out Reading', 'Total Hr', 'Diesel Filled (L)', 'Remark']);
  mRows.forEach((r, i) => {
    const n = i + 3;
    M[n - 1] = [D_(r.date), T(r.machineNo), T(r.type),
      has(r.inR) ? N_(num(r.inR), SY.dec1) : T('', SY.txt),
      has(r.outR) ? N_(num(r.outR), SY.dec1) : T('', SY.txt),
      F_(`IF(OR($D${n}="",$E${n}=""),"",$E${n}-$D${n})`, SY.dec1),
      has(r.diesel) ? N_(num(r.diesel), SY.dec1) : T('', SY.txt),
      T(r.remark)];
  });
  let tr = mRows.length + 3;
  M[tr - 1] = [T('TOTAL', SY.bold), T('', SY.bold), T('', SY.bold), T('', SY.bold), T('', SY.bold),
    F_(SUMR('F', 3, tr - 1), SY.tot), F_(SUMR('G', 3, tr - 1), SY.tot), T('', SY.bold)];
  sheets.push({ name: 'Machine Log', tabSelected: true, freeze: 2, cols: [13, 13, 14, 12, 12, 10, 14, 30], rows: M, merges: ['A1:H1'], heights: { 1: 26, 2: 28 } });

  const D2 = head('Diesel Purchase', ['Date', 'Diesel Vendor', 'Diesel (L)', 'Bill No', 'Amount (Rs)', 'Status', 'Paid By', 'Rate / L', 'Remark']);
  dRows.forEach((r, i) => {
    const n = i + 3;
    D2[n - 1] = [D_(r.date), T(r.vendor),
      has(r.litres) ? N_(num(r.litres), SY.dec2) : T('', SY.txt),
      T(r.bill),
      has(r.amount) ? N_(num(r.amount)) : T('', SY.txt),
      T(r.status), T(r.paidBy),
      F_(`IF(OR($C${n}="",$E${n}=""),"",$E${n}/$C${n})`, SY.dec2),
      T(r.remark)];
  });
  tr = dRows.length + 3;
  D2[tr - 1] = [T('TOTAL', SY.bold), T('', SY.bold), F_(SUMR('C', 3, tr - 1), SY.tot), T('', SY.bold),
    F_(SUMR('E', 3, tr - 1), SY.tot), T('', SY.bold), T('', SY.bold), T('', SY.bold), T('', SY.bold)];
  sheets.push({ name: 'Diesel Purchase', freeze: 2, cols: [13, 20, 11, 12, 14, 10, 13, 10, 26], rows: D2, merges: ['A1:I1'], heights: { 1: 26, 2: 28 } });
  return sheets;
}

function xlsxBytes(mRows, dRows) {
  const sheets = supSheets(mRows, dRows);
  const files = [];
  const ct = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">',
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>',
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>',
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'];
  sheets.forEach((sh, i) => ct.push(`<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`));
  ct.push('</Types>');
  files.push({ name: '[Content_Types].xml', data: ENC.encode(ct.join('')) });
  files.push({ name: '_rels/.rels', data: ENC.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>') });
  files.push({ name: 'xl/workbook.xml', data: ENC.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' + sheets.map((sh, i) => `<sheet name="${X(sh.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets><calcPr calcId="171027" fullCalcOnLoad="1"/></workbook>') });
  files.push({ name: 'xl/_rels/workbook.xml.rels', data: ENC.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + sheets.map((sh, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') + `<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`) });
  files.push({ name: 'xl/styles.xml', data: ENC.encode(STYLES_XML) });
  sheets.forEach((sh, i) => files.push({ name: `xl/worksheets/sheet${i + 1}.xml`, data: ENC.encode(sheetXml(sh)) }));
  return zipStore(files);
}

function download(name, data, type) {
  const blob = new Blob([data], { type: type || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

document.addEventListener('click', async e => {
  const seg = e.target.closest('[data-seg]');
  if (seg) { document.querySelectorAll('#' + seg.dataset.seg + ' button').forEach(b => b.classList.remove('on')); seg.classList.add('on'); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;

  if (a === 'mkLogin') {
    const name = gv('l_name'), id = gv('l_id'), pw = gv('l_pw'), pw2 = gv('l_pw2');
    if (!id) { UI.err = 'Enter a login ID'; return render(); }
    if (pw.length < 4) { UI.err = 'Password must be at least 4 characters'; return render(); }
    if (pw !== pw2) { UI.err = 'The two passwords do not match'; return render(); }
    const st = uid() + uid();
    DB.auth = { salt: st, users: [{ userId: id, name: name || id, hash: await sha(pw + ':' + st) }] };
    if (!DB.supervisor) DB.supervisor = name || id;
    ME = { userId: id, name: name || id }; saveSession(); UI.err = '';
    await save(); render(); toast('Login created'); return;
  }
  if (a === 'doLogin') {
    const u = await checkLogin(gv('l_id'), gv('l_pw'));
    if (!u) { UI.err = 'Wrong login ID or password'; return render(); }
    ME = { userId: u.userId, name: u.name }; saveSession(); UI.err = '';
    render(); return;
  }
  if (a === 'logout') {
    if (!confirm('Log out? You will need your login ID and password again.')) return;
    ME = null; saveSession(); UI = {}; render(); return;
  }
  if (a === 'bkDown') {
    download('reading-book-backup-' + today() + '.json', JSON.stringify(DB), 'application/json');
    toast('Backup downloaded'); return;
  }
  if (a === 'bkUp') {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = async () => {
        let d;
        try { d = JSON.parse(rd.result); } catch (e) { return alert('This file could not be read.'); }
        if (!d || !d.days || !d.machines) return alert('This is not a Reading Book backup file.');
        if (!confirm('Replace everything on this phone with the data in this file?')) return;
        DB = d;
        ['machines', 'pumps', 'people', 'diesel'].forEach(k => { if (!Array.isArray(DB[k])) DB[k] = []; });
        if (!DB.days) DB.days = {}; if (!DB.sent) DB.sent = {};
        await save(); render(); toast('Backup imported');
      };
      rd.readAsText(f);
    };
    inp.click(); return;
  }
  if (a === 'tab') { TAB = v; UI.dEdit = null; render(); return; }
  if (a === 'scope') { UI.scope = v; render(); return; }
  if (a === 'dayShift') { DAY = v === 'today' ? today() : shiftDay(DAY, +v); render(); return; }
  if (a === 'openDay') { DAY = v; TAB = 'machine'; render(); return; }
  if (a === 'dMore') { UI.dMore = (UI.dMore || 40) + 60; render(); return; }

  if (a === 'worked') {
    DB.days[DAY] = DB.days[DAY] || { rows: {} };
    const r = DB.days[DAY].rows[v] = DB.days[DAY].rows[v] || {};
    r.worked = el.dataset.w === '1';
    touched(DAY); await save(); render(); return;
  }

  /* ---- diesel ---- */
  if (a === 'dOpen') { UI.dEdit = v; TAB = 'diesel'; render(); window.scrollTo(0, 0); return; }
  if (a === 'dCancel') { UI.dEdit = null; UI.dNew = null; render(); return; }
  if (a === 'dSave') {
    const o = {
      date: gv('d_date') || DAY, vendor: gv('d_vendor'),
      litres: gv('d_litres') === '' ? '' : num(gv('d_litres')),
      amount: gv('d_amount') === '' ? '' : num(gv('d_amount')),
      bill: gv('d_bill'), status: segVal('d_st') || 'Unpaid',
      paidBy: gv('d_by'), remark: gv('d_remark')
    };
    if (!o.vendor) return toast('Select the pump');
    if (o.amount === '' && o.litres === '') return toast('Enter litres or amount');
    if (o.status !== 'Paid') o.paidBy = '';
    if (UI.dEdit) {
      const r = DB.diesel.find(x => x.id === UI.dEdit);
      const old = r.date; Object.assign(r, o); touched(old);
    } else DB.diesel.push({ id: uid(), ...o });
    touched(o.date);
    UI.dEdit = null; UI.dNew = null;
    await save(); render(); toast('Saved'); return;
  }
  if (a === 'dDelete') {
    const r = DB.diesel.find(x => x.id === UI.dEdit);
    if (!r || !confirm('Delete this diesel entry?')) return;
    touched(r.date);
    DB.diesel = DB.diesel.filter(x => x.id !== UI.dEdit);
    UI.dEdit = null; await save(); render(); toast('Deleted'); return;
  }

  /* ---- setup ---- */
  if (a === 'mAdd') {
    const no = gv('f_no'), type = gv('f_type');
    if (!no) return toast('Enter machine number');
    if (DB.machines.some(m => m.no.toLowerCase() === no.toLowerCase())) return toast('Already in the list');
    DB.machines.push({ no, type });
    await save(); render(); toast(no + ' added'); return;
  }
  if (a === 'mDel') {
    const m = DB.machines[+v];
    if (!confirm('Remove ' + m.no + '? Entries already filled will stay.')) return;
    DB.machines.splice(+v, 1); await save(); render(); return;
  }
  if (a === 'listAdd') {
    const k = el.dataset.k, val2 = gv('l_' + k);
    if (!val2) return toast('Type a name first');
    if (DB[k].includes(val2)) return toast('Already in the list');
    DB[k].push(val2); await save(); render(); return;
  }
  if (a === 'listDel') { DB[el.dataset.k].splice(+v, 1); await save(); render(); return; }

  /* ---- send ---- */
  if (a === 'sendWa') { window.open('https://wa.me/?text=' + encodeURIComponent(waText(sendDays())), '_blank'); return; }
  if (a === 'sendXlsx') {
    const days = sendDays(), m = machineRows(days), d = dieselRows(days);
    if (!m.length && !d.length) return toast('Nothing to send');
    download('Site_Report_' + fileTag() + '.xlsx', xlsxBytes(m, d), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    toast('Excel file ready'); return;
  }
  if (a === 'sendJson') {
    const days = sendDays();
    const pack = {
      type: 'sup-log', v: 2, site: DB.site || '', supervisor: DB.supervisor || '', made: today(),
      machineRows: machineRows(days), dieselRows: dieselRows(days)
    };
    if (!pack.machineRows.length && !pack.dieselRows.length) return toast('Nothing to send');
    download('site-data-' + fileTag() + '.json', JSON.stringify(pack), 'application/json');
    toast('Data file ready — send it to the office'); return;
  }
  if (a === 'markSent') {
    const days = sendDays();
    if (!days.length) return;
    if (!confirm('Mark ' + days.length + ' day(s) as sent?')) return;
    markSent(days); await save(); UI.scope = 'unsent'; render(); toast('Marked as sent'); return;
  }
});

/* ---- typing ---- */
document.addEventListener('input', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'siteName') { DB.site = el.value; save(); return; }
  if (a === 'supName') { DB.supervisor = el.value; save(); return; }
  if (a === 'dCalc') {
    const l = num(gv('d_litres')), am = num(gv('d_amount'));
    const box = document.getElementById('d_rate');
    if (box) box.value = l ? dec(am / l, 2) : '';
    return;
  }
  if (a === 'fld') {
    DB.days[DAY] = DB.days[DAY] || { rows: {} };
    const r = DB.days[DAY].rows[el.dataset.v] = DB.days[DAY].rows[el.dataset.v] || {};
    const f = el.dataset.f;
    r[f] = el.value === '' ? '' : (f === 'remark' ? el.value : num(el.value));
    touched(DAY); save();
    if (f === 'in' || f === 'out') {
      const card = el.closest('.row'), amt = card && card.querySelector('.amt');
      if (amt) {
        const iv = card.querySelector('[data-f="in"]').value, ov = card.querySelector('[data-f="out"]').value;
        const h = (iv !== '' && ov !== '') ? num(ov) - num(iv) : '';
        amt.innerHTML = (h === '' ? '—' : dec(h, 1)) + '<span class="tiny" style="font-weight:500"> hr</span>';
        amt.style.color = (h !== '' && h < 0) ? 'var(--due)' : 'var(--rent)';
      }
    }
  }
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'setDay') { DAY = el.value; render(); }
});

(async () => { await loadDB(); render(); })();

</script>
</body>
</html>
