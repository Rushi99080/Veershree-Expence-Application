<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Manager</title>
<meta name="theme-color" content="#141A1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Site Manager">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141A1F;
  --ink-2:#39454F;
  --steel:#6B7A87;
  --line:#D6DDE3;
  --line-2:#EBEFF2;
  --bg:#EDF1F4;
  --surface:#FFFFFF;
  --hivis:#F5B301;
  --hivis-dk:#C08D00;
  --paid:#15784B;
  --paid-bg:#E3F3EA;
  --due:#C0392B;
  --due-bg:#FBE9E7;
  --rent:#2C5F8A;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.45;
  padding-bottom:calc(118px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Barlow Condensed','Barlow',sans-serif;margin:0;font-weight:700;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
button{cursor:pointer}
a{color:var(--rent)}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;
  padding:calc(8px + env(safe-area-inset-top)) 12px 0;
}
.tb-row{display:flex;align-items:center;gap:8px;padding-bottom:8px}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;letter-spacing:.02em;line-height:1;flex:0 0 auto}
.brand span{display:block;font-size:10.5px;font-family:'Barlow',sans-serif;font-weight:500;color:#93A3AF;letter-spacing:.08em;margin-top:2px}
.sitepick{
  flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:6px;justify-content:flex-end;
  background:#222C34;border:1px solid #33414B;border-radius:8px;padding:7px 10px;color:#fff;
}
.sitepick b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.sitepick i{font-style:normal;color:var(--hivis);font-size:11px}
.lockbtn{flex:0 0 auto;background:#222C34;border:1px solid #33414B;color:var(--hivis);border-radius:8px;padding:8px 9px;font-size:10px;font-weight:700;letter-spacing:.06em}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;background:none;border:0;color:#93A3AF;padding:9px 11px 10px;
  font-size:13.5px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;
}
.tab.on{color:#fff;border-bottom-color:var(--hivis)}

/* ---------- layout ---------- */
main{padding:12px 12px 24px;max-width:820px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.card>h3{
  padding:10px 12px;font-size:15px;border-bottom:1px solid var(--line-2);
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.card>h3 small{font-family:'Barlow',sans-serif;font-weight:500;font-size:12px;color:var(--steel)}
.pad{padding:12px}
.muted{color:var(--steel);font-size:13px}
.tiny{font-size:12px;color:var(--steel)}
.right{text-align:right}
.center{text-align:center}
.mt{margin-top:12px}

/* ---------- hero totals ---------- */
.hero{background:var(--ink);color:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px}
.hero .lbl{font-size:11px;letter-spacing:.1em;color:#93A3AF;font-weight:600}
.hero .big{font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:700;line-height:1.05;margin-top:2px}
.hero .big small{font-size:20px;color:var(--hivis);margin-right:4px;font-weight:600}
.hsplit{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:#33414B;border-radius:8px;overflow:hidden;margin-top:12px}
.hsplit div{background:#1C242B;padding:9px 10px}
.hsplit .k{font-size:10.5px;color:#93A3AF;font-weight:600;letter-spacing:.04em}
.hsplit .v{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;margin-top:1px}
.pendbar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;background:var(--hivis);color:#241C00;border-radius:8px;padding:9px 12px}
.pendbar b{font-family:'Barlow Condensed',sans-serif;font-size:22px}

/* ---------- kpi grid ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px}
.kpi .k{font-size:11px;color:var(--steel);font-weight:600;letter-spacing:.03em}
.kpi .v{font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:700;margin-top:2px;line-height:1.1}
.kpi.g .v{color:var(--paid)} .kpi.r .v{color:var(--due)} .kpi.b .v{color:var(--rent)}
.k3{grid-template-columns:1fr 1fr 1fr}

/* ---------- tables ---------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;font-weight:600;font-size:11px;letter-spacing:.04em;color:var(--steel);
  padding:7px 10px;border-bottom:1px solid var(--line);background:#F7F9FA;white-space:nowrap;
}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;background:#F7F9FA;border-top:1px solid var(--line)}
.nowrap{white-space:nowrap}

/* ---------- log rows ---------- */
.row{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line-2);align-items:flex-start}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .ttl{font-weight:600;font-size:14.5px;word-break:break-word}
.row .sub{font-size:12px;color:var(--steel);margin-top:2px}
.row .amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;letter-spacing:.03em}
.pill.p{background:var(--paid-bg);color:var(--paid)}
.pill.u{background:var(--due-bg);color:var(--due)}
.pill.n{background:#EEF2F5;color:var(--ink-2)}
.rowbtn{background:none;border:0;padding:6px 2px 0;color:var(--steel);font-size:12px;font-weight:600}

/* ---------- forms ---------- */
.field{margin-bottom:10px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:.03em;margin-bottom:3px}
.field input,.field select,.field textarea{
  width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--hivis);outline-offset:-1px;border-color:var(--hivis)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;
  padding:12px;border-radius:9px;border:0;background:var(--hivis);color:#241C00;font-weight:700;font-size:15px;
}
.btn:active{background:var(--hivis-dk)}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.dk{background:var(--ink);color:#fff}
.btn.dgr{background:#fff;border:1px solid #E7B7B1;color:var(--due)}
.btn.sm{width:auto;padding:8px 12px;font-size:13.5px}
.btnrow{display:flex;gap:8px;margin-top:4px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:#fff;padding:10px 6px;font-size:13.5px;font-weight:600;color:var(--steel)}
.seg button.on{background:var(--ink);color:#fff}
.seg.pu button.on[data-v="Paid"]{background:var(--paid)}
.seg.pu button.on[data-v="Unpaid"]{background:var(--due)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line-2);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(6,1fr);
  background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
.nav button{background:none;border:0;padding:8px 2px 9px;color:var(--steel);font-size:10.5px;font-weight:600;line-height:1.2}
.nav button svg{display:block;margin:0 auto 2px;width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--ink)}
.nav button.on svg{stroke:var(--hivis-dk)}

.nav.n7 button,.nav.n8 button{font-size:9.5px;padding:7px 1px 8px}
.nav.n7 button svg,.nav.n8 button svg{width:19px;height:19px}
.logo{height:26px;width:auto;max-width:88px;object-fit:contain;border-radius:4px;background:#fff;padding:2px;flex:0 0 auto}
.logobox{display:flex;align-items:center;gap:8px;flex:0 0 auto}

.prt{position:fixed;inset:0;z-index:100;background:#fff;overflow-y:auto;padding:16px 14px calc(90px + env(safe-area-inset-bottom))}
.prtbar{position:fixed;left:0;right:0;bottom:0;z-index:101;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.bill{max-width:760px;margin:0 auto;color:#000;font-size:12.5px}
.bill h1{font-family:'Barlow Condensed',sans-serif;font-size:22px;margin:0 0 2px}
.bill .meta{font-size:11.5px;color:#333;margin-bottom:12px;line-height:1.6}
.bill table{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:14px}
.bill th{background:#EEF2F5;border:1px solid #B9C4CC;padding:5px 6px;text-align:left;font-size:10.5px;letter-spacing:.03em}
.bill td{border:1px solid #D6DDE3;padding:4px 6px;vertical-align:top}
.bill td.n,.bill th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bill tfoot td{font-weight:700;background:#F5F7F9}
.bill .kpi{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.bill .kpi div{border:1px solid #B9C4CC;border-radius:6px;padding:6px 10px;min-width:100px}
.bill .kpi b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:17px}
.bill .kpi span{font-size:9.5px;letter-spacing:.06em;color:#444}
.bill h2{font-family:'Barlow Condensed',sans-serif;font-size:15px;margin:16px 0 6px;border-bottom:1.5px solid #000;padding-bottom:2px}
.bill .sign{margin-top:26px;display:flex;justify-content:space-between;font-size:11px;color:#333}
@media print{
  body{background:#fff!important;padding:0!important}
  body > *{display:none!important}
  body > #print{display:block!important}
  .prt{position:static;padding:0;overflow:visible}
  .prtbar{display:none!important}
  .bill{max-width:none;font-size:11px}
  @page{margin:12mm}
}

.arow{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface);margin-bottom:7px;touch-action:none;user-select:none}
.arow.drag{background:#FFF7DB;border-color:var(--hivis);box-shadow:0 6px 18px rgba(15,20,25,.16);opacity:.96}
.arow .hnd{width:26px;flex:0 0 26px;color:var(--steel);font-size:17px;line-height:1;text-align:center;cursor:grab}
.arow .anm{flex:1;font-weight:600;font-size:14px}
.arow .asub{font-weight:400;font-size:11px;color:var(--steel);display:block}
.arow .abtn{width:34px;height:32px;flex:0 0 34px;border:1px solid var(--line);border-radius:8px;
  background:#F7F9FA;font-size:14px;color:var(--ink)}

/* ---------- sheet / modal ---------- */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(15,20,25,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{
  background:var(--bg);width:100%;max-width:820px;max-height:92vh;overflow-y:auto;
  border-radius:16px 16px 0 0;padding:14px 12px calc(20px + env(safe-area-inset-bottom));
}
.sheet h3{font-size:18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--steel);padding:0 4px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:90;
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:13.5px;font-weight:600;
  box-shadow:0 6px 20px rgba(15,20,25,.3);
}
.empty{padding:26px 16px;text-align:center;color:var(--steel);font-size:13.5px}
.warn{background:#FFF8E1;border:1px solid #F0D48A;color:#6B5300;padding:10px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px}
.bar{height:5px;background:var(--line-2);border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--rent)}
.lockwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px;background:var(--ink)}
.lock{width:100%;max-width:380px;color:#fff}
.lock .lg{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;line-height:1.1}
.lock .sm2{color:#93A3AF;font-size:13px;margin-top:6px;line-height:1.6}
.lock input{width:100%;padding:14px;border-radius:10px;border:1px solid #33414B;background:#1C242B;color:#fff;font-size:18px;letter-spacing:.25em;text-align:center;margin-top:14px}
.lock input::placeholder{letter-spacing:normal;color:#5C6B77}
.lock .btn{margin-top:12px}
.lock .err{background:#3A1D1A;border:1px solid #6B2C24;color:#FFB4A8;padding:9px 12px;border-radius:8px;font-size:12.5px;margin-top:12px}
.lock .skip{display:block;text-align:center;color:#93A3AF;font-size:12.5px;margin-top:16px;text-decoration:underline}
.lockbtn{flex:0 0 auto;background:#222C34;border:1px solid #33414B;border-radius:8px;color:#93A3AF;padding:7px 9px;font-size:15px;line-height:1}
.robar{background:var(--rent);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:5px 12px;text-align:center}
/* fakt baghnyachya mode madhe: badal karnyache buttons lapavaayche,
   pan entries chya rows disaylach havyat */
body.ro button[data-act$="Add"],body.ro button[data-act="xlAllDone"],body.ro button[data-act="xlReset"],
body.ro button[data-act="impJson"],body.ro button[data-act="snapList"],body.ro button[data-act="snapBack"],
body.ro button[data-act="xlCopy"],body.ro button[data-act="siteEdit"],body.ro .rowbtn{display:none !important}
/* English var, Hindi khali */
label i,h3 i,.kpi .k i,.hsplit .k i,.btn i,.chip i,.empty i,.tab i,.row .ttl i{
  display:block;font-style:normal;font-weight:500;font-size:10.5px;color:var(--steel);letter-spacing:0;margin-top:1px;line-height:1.3}
h3 i{font-family:'Barlow',sans-serif;font-weight:500}
.hero .lbl i,.hsplit .k i{color:#7C8B98}
.btn i{color:rgba(36,28,0,.62);font-size:10px}
.btn.dk i,.btn.sec i,.btn.dgr i{color:var(--steel)}
.tab i{font-size:9.5px;color:#6B7A87}
.seg button i{display:block;font-style:normal;font-size:9.5px;font-weight:500;color:var(--steel)}
.seg button.on i{color:rgba(255,255,255,.7)}
.searchwrap{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:45;
  background:var(--surface);border-top:1px solid var(--line);padding:7px 10px;display:flex;gap:8px;align-items:center}
.searchwrap input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:99px;background:#F4F7F9;font-size:15px}
.searchwrap input:focus{outline:2px solid var(--hivis);outline-offset:-1px;background:#fff}
.searchwrap button{flex:0 0 auto;background:none;border:0;color:var(--steel);font-size:13px;font-weight:700;padding:6px 8px}
.spanel{position:fixed;left:0;right:0;top:0;bottom:calc(112px + env(safe-area-inset-bottom));z-index:44;
  background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 20px}
.shead{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--steel);padding:10px 2px 6px}
.brandlogo{height:30px;max-width:130px;object-fit:contain;display:block}
@media (min-width:640px){ .kpis{grid-template-columns:repeat(4,1fr)} .k3{grid-template-columns:repeat(3,1fr)} }
@media (prefers-reduced-motion:no-preference){ .sheet .box{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px)}} }
</style>

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="print"></div>
<script>
/* ---------- error disla tar screen var dakhva (blank page nako) ---------- */
window.onerror = function (msg, src, line) {
  try {
    document.getElementById('app').innerHTML =
      '<div style="padding:24px;font-family:system-ui"><div style="font-weight:700;font-size:18px;margin-bottom:8px">App madhe error</div>' +
      '<div style="font-size:13px;color:#555;line-height:1.6">' + String(msg) + '<br>line ' + line + '</div>' +
      '<div style="font-size:13px;margin-top:14px">Ha message Claude la pathva. Tumcha data suraksit aahe.</div></div>';
  } catch (e) { }
};
window.addEventListener('unhandledrejection', function (e) { console.error('promise error', e.reason); });
/* ============================================================
   STORAGE  —  data kadhich jau naye yasathi
   Claude madhe chalvla tar Claude chi storage, website var chalvla
   tar phone madhli IndexedDB (+ localStorage backup + rojche snapshots)
   ============================================================ */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const rq = indexedDB.open('vsms', 1);
      rq.onupgradeneeded = () => { rq.result.createObjectStore('kv'); };
      rq.onsuccess = () => { this.db = rq.result; res(this.db); };
      rq.onerror = () => rej(rq.error);
    });
  },
  async tx(mode) { const db = await this.open(); return db.transaction('kv', mode).objectStore('kv'); },
  async get(k) { const s = await this.tx('readonly'); return new Promise((res, rej) => { const r = s.get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async set(k, v) { const s = await this.tx('readwrite'); return new Promise((res, rej) => { const r = s.put(v, k); r.onsuccess = () => res(true); r.onerror = () => rej(r.error); }); },
  async del(k) { const s = await this.tx('readwrite'); return new Promise(res => { const r = s.delete(k); r.onsuccess = () => res(true); r.onerror = () => res(false); }); },
  async keys() { const s = await this.tx('readonly'); return new Promise(res => { const r = s.getAllKeys(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); }); }
};

const HAS_CLAUDE_STORE = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';

const Store = {
  mode: HAS_CLAUDE_STORE ? 'claude' : 'device',
  async get(k) {
    if (HAS_CLAUDE_STORE) { try { const r = await window.storage.get(k); return r && r.value; } catch (e) { return null; } }
    let v = null;
    try { if (window.indexedDB) v = await IDB.get(k); } catch (e) { }
    if (v == null) { try { v = localStorage.getItem(k); } catch (e) { } }   /* dusri copy */
    return v;
  },
  async set(k, v) {
    if (HAS_CLAUDE_STORE) { await window.storage.set(k, v); return; }
    let ok = false;
    try { if (window.indexedDB) { await IDB.set(k, v); ok = true; } } catch (e) { }
    try { if (v.length < 4500000) { localStorage.setItem(k, v); ok = true; } } catch (e) { }
    if (!ok) throw new Error('storage madhe save hot nahi');
  },
  /* rojcha ek snapshot, shevatche 21 divas thevto */
  async snapshot(v) {
    if (HAS_CLAUDE_STORE) return;
    try {
      await IDB.set('snap:' + today(), v);
      const keys = (await IDB.keys()).filter(k => String(k).startsWith('snap:')).sort();
      while (keys.length > 21) { await IDB.del(keys.shift()); }
    } catch (e) { }
  },
  async snapshots() {
    if (HAS_CLAUDE_STORE) return [];
    try { return (await IDB.keys()).filter(k => String(k).startsWith('snap:')).sort().reverse(); } catch (e) { return []; }
  },
  async snapshotGet(k) { try { return await IDB.get(k); } catch (e) { return null; } }
};

/* ---------- passcode ---------- */
async function sha(txt) {
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 5381; for (let i = 0; i < txt.length; i++) h = ((h * 33) ^ txt.charCodeAt(i)) >>> 0;
    return 'f' + h.toString(16);
  }
}

}

/* ---------- Excel paste block ---------- */
const XLDATE = d => {
  if (!d) return '';
  const p = String(d).split('-'); if (p.length !== 3) return d;
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return p[2] + '-' + M[+p[1] - 1] + '-' + p[0];
};
const clean = v => String(v == null ? '' : v).replace(/[\t\r\n]+/g, ' ');

function xlBlock(s, k, startRow) {
  const rows = pending(s, k);
  return rows.map((r, i) => {
    const n = startRow + i;
    let cells;
    if (k === 'machineLog') cells = [
      XLDATE(r.date), r.machineNo,
      `=IF($C${n}="","",IFERROR(INDEX('Machine Master'!$C$3:$C$102,MATCH($C${n},'Machine Master'!$B$3:$B$102,0)),"Not Found"))`,
      has(r.inR) ? r.inR : '', has(r.outR) ? r.outR : '',
      `=IF(OR($E${n}="",$F${n}=""),"",$F${n}-$E${n})`,
      has(r.diesel) ? r.diesel : '', r.remark
    ];
    else if (k === 'dieselLog') cells = [XLDATE(r.date), r.vendor, has(r.litres) ? r.litres : '', r.bill, has(r.amount) ? r.amount : '', st(r), r.paidBy, r.remark];
    else if (k === 'expenseLog') cells = [XLDATE(r.date), r.category, r.desc, r.vendor, has(r.amount) ? r.amount : '', st(r), r.paidBy, r.remark];
    else cells = [XLDATE(r.date), r.vendor, has(r.amount) ? r.amount : '', r.paidBy, r.mode, r.remark];
    return cells.map(clean).join('\t');
  }).join('\n');
}

   CALCULATIONS  (Excel formulas -> JS)
   ============================================================ */

/* machine type lookup — Machine Log column D */
const sameNo = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
function machineOf(s, no) { return (s.machines || []).find(x => sameNo(x.no, no)) || null; }
function machineType(s, no) { const m = machineOf(s, no); return m ? m.type : ''; }

/* hours = Out Reading - In Reading  (Machine Log column G) */
function hoursOf(r) { return (has(r.inR) && has(r.outR)) ? num(r.outR) - num(r.inR) : 0; }

/* rate basis + per hour/day rate — Machine Master G overrides Rate Master C */
function rateInfo(s, no) {
  const m = machineOf(s, no); if (!m) return { basis: '', unit: 0, rate: 0, units: 1 };
  const rm = s.rateMaster.find(r => r.type === m.type);
  if (!rm) return { basis: '', unit: 0, rate: 0, units: 1 };
  const rate = has(m.monthlyRate) && num(m.monthlyRate) > 0 ? num(m.monthlyRate) : num(rm.packageRate);
  const units = num(rm.packageUnits) || 1;
  return { basis: rm.basis, unit: rate / units, rate, units };
}

/* rent per machine. Daily basis = entry count, Hourly = sum of hours */
function machineRent(s, no, from, to) {
  const ri = rateInfo(s, no);
  const logs = s.machineLog.filter(r => r.machineNo === no && inRange(r.date, from, to));
  const hrs = logs.reduce((a, r) => a + hoursOf(r), 0);
  const diesel = logs.reduce((a, r) => a + num(r.diesel), 0);
  const qty = ri.basis === 'Daily' ? logs.length : hrs;
  return { ...ri, entries: logs.length, hours: hrs, diesel, qty, rent: ri.unit * qty };
}

function inRange(d, from, to) {
  if (!d) return false;
  if (from && d < from) return false;
  if (to && d > to) return false;
  return true;
}

/* --- murum: amount = qty x rate, kiwa direct amount --- */
function mAmt(r) {
  if (has(r.amount) && num(r.amount)) return num(r.amount);
  return num(r.qty) * num(r.rate);
}

/* ti machine chya sarvat pahilya divsachi entry aahe ka */
function firstDayFor(s, no, date, rec) {
  if (!no || !date) return false;
  const others = (s.machineLog || []).filter(r => sameNo(r.machineNo, no) && (!rec || r.id !== rec.id));
  if (!others.length) return true;
  const first = others.reduce((a, r) => (String(r.date) < a ? String(r.date) : a), '9999-99-99');
  return String(date) <= first;
}

/* ---------- diesel stock: aala kiti, bharla kiti, shillak kiti ---------- */
function stockDays(s) {
  const rec = {}, fil = {};
  (s.dieselLog || []).forEach(d => { if (d.date) rec[d.date] = (rec[d.date] || 0) + num(d.litres); });
  (s.machineLog || []).forEach(r => { if (r.date) fil[r.date] = (fil[r.date] || 0) + num(r.diesel); });
  const days = [...new Set(Object.keys(rec).concat(Object.keys(fil)))].filter(Boolean).sort();
  let run = num(s.stockOpening);
  return days.map(d => {
    const r = rec[d] || 0, f = fil[d] || 0;
    run += r - f;
    return { date: d, rec: r, fil: f, net: r - f, stock: run };
  });
}
function stockTotals(s) {
  const days = stockDays(s);
  const rec = days.reduce((a, x) => a + x.rec, 0);
  const fil = days.reduce((a, x) => a + x.fil, 0);
  return { days, rec, fil, opening: num(s.stockOpening), stock: num(s.stockOpening) + rec - fil };
}
function stockDay(s, d) {
  return {
    bills: (s.dieselLog || []).filter(x => x.date === d),
    fills: (s.machineLog || []).filter(x => x.date === d && num(x.diesel))
  };
}

/* ---------- machine no che variants shodhun ek karnyasathi ---------- */
function mKey(no) {
  const t = String(no || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/O/g, '0');
  const digits = t.replace(/[^0-9]/g, '');
  let letters = t.replace(/[0-9]/g, '');
  if (!letters) letters = 'PC';
  return letters + (digits ? String(parseInt(digits, 10)) : '');
}

function machineGroups(s) {
  const cnt = {};
  (s.machineLog || []).forEach(r => {
    if (!r.machineNo) return;
    cnt[r.machineNo] = cnt[r.machineNo] || { no: r.machineNo, n: 0, type: machineType(s, r.machineNo) || '' };
    cnt[r.machineNo].n++;
  });
  (s.machines || []).forEach(m => {
    if (!cnt[m.no]) cnt[m.no] = { no: m.no, n: 0, type: m.type || '' };
    else if (!cnt[m.no].type) cnt[m.no].type = m.type || '';
  });
  const g = {};
  Object.values(cnt).forEach(x => { const k = mKey(x.no); (g[k] = g[k] || []).push(x); });
  const out = [];
  Object.keys(g).forEach(k => {
    const byType = {};
    g[k].forEach(x => { const t = x.type || '?'; (byType[t] = byType[t] || []).push(x); });
    const known = Object.keys(byType).filter(t => t !== '?');
    if (known.length > 1) {
      known.forEach(t => {
        const items = byType[t].concat(byType['?'] || []);
        if (items.length > 1) out.push({ key: k + '|' + t, items, type: t });
      });
      return;
    }
    if (g[k].length > 1) out.push({ key: k, items: g[k], type: known[0] || '' });
  });
  return out.map(o => {
    const items = o.items.slice().sort((a, b) => b.n - a.n);
    let target = items[0].no;
    const m = mKey(items[0].no);
    if (/^PC\d+$/.test(m) && (o.type === 'Poclain' || !o.type)) target = 'PC.' + String(m.slice(2)).padStart(2, '0');
    return { key: o.key, target, items, total: items.reduce((a, x) => a + x.n, 0) };
  }).sort((a, b) => b.items.length - a.items.length || b.total - a.total);
}

function renameMachine(s, from, to) {
  if (!from || !to || from === to) return 0;
  let moved = 0;
  const seen = {};
  s.machineLog.forEach(r => { if (sameNo(r.machineNo, to) && r.machineNo !== from) seen[r.date] = 1; });
  const keep = [];
  s.machineLog.forEach(r => {
    if (r.machineNo !== from) { keep.push(r); return; }
    if (seen[r.date]) { moved++; return; }
    r.machineNo = to; seen[r.date] = 1; keep.push(r); moved++;
  });
  s.machineLog = keep;
  const tgt = s.machines.find(m => sameNo(m.no, to) && m.no !== from);
  const src = s.machines.find(m => m.no === from);
  if (src) {
    if (tgt) {
      if (!tgt.owner && src.owner) tgt.owner = src.owner;
      if (!tgt.operator && src.operator) tgt.operator = src.operator;
      if (!tgt.make && src.make) tgt.make = src.make;
      if (!has(tgt.monthlyRate) && has(src.monthlyRate)) tgt.monthlyRate = src.monthlyRate;
      s.machines = s.machines.filter(m => m.id !== src.id);
    } else src.no = to;
  } else if (!tgt) {
    s.machines.push({ id: uid(), no: to, type: '', owner: '', operator: '', make: '', monthlyRate: '' });
  }
  return moved;
}

function settle(s) {
  const map = {};
  const pool = {};                                     /* vendor -> vaparaychi urleli payment */
  const payList = {};                                  /* vendor -> payments (date nusar) */
  (s.vendorPayments || []).forEach(p => {
    const v = p.vendor || '';
    pool[v] = (pool[v] || 0) + num(p.amount);
    (payList[v] = payList[v] || []).push(p);
  });
  Object.keys(payList).forEach(v => payList[v].sort((a, b) => String(a.date).localeCompare(String(b.date))));

  const ledger = []
    .concat(s.expenseLog.map((e, i) => ({ id: e.id, vendor: e.vendor, date: e.date, amount: num(e.amount), st: st(e), by: e.paidBy, ord: i, kind: 0 })))
    .concat((s.murumLog || []).map((m, i) => ({ id: m.id, vendor: m.vendor, date: m.date, amount: mAmt(m), st: st(m), by: m.paidBy, ord: i, kind: 1 })))
    .concat((s.dieselLog || []).map((d, i) => ({ id: d.id, vendor: d.vendor, date: d.date, amount: num(d.amount), st: st(d), by: d.paidBy, ord: i, kind: 2 })));

  /* aadhi thet dilele */
  ledger.forEach(x => {
    if (x.st === 'Paid') map[x.id] = { final: 'Paid', paid: x.amount, by: x.by || '' };
    else if (!x.vendor) map[x.id] = { final: 'Unpaid', paid: 0, by: '' };
  });
  /* urleli udhaari: junya tarkhे pasun payment lavaychi */
  const open = ledger.filter(x => x.st !== 'Paid' && x.vendor)
    .sort((a, b) => String(a.date || '9999').localeCompare(String(b.date || '9999')) || a.kind - b.kind || a.ord - b.ord);
  open.forEach(x => {
    const have = pool[x.vendor] || 0;
    if (have <= 0.004) { map[x.id] = { final: 'Unpaid', paid: 0, by: '' }; return; }
    const use = Math.min(have, x.amount);
    pool[x.vendor] = have - use;
    const full = use >= x.amount - 0.004;
    const who = (payList[x.vendor] || []).map(p => p.paidBy).filter(Boolean);
    map[x.id] = { final: full ? 'Paid' : 'Unpaid', paid: use, by: full ? (who[who.length - 1] || 'vendor payment') : '' };
  });
  return map;
}

/* --- totals for the whole site (Plot Dashboard) --- */
function totals(s) {
  const fin = settle(s);
  const expTotal = s.expenseLog.reduce((a, e) => a + num(e.amount), 0);
  const expPaidDirect = s.expenseLog.filter(e => st(e) === 'Paid').reduce((a, e) => a + num(e.amount), 0);
  const expUnpaidRaw = s.expenseLog.filter(e => st(e) === 'Unpaid').reduce((a, e) => a + num(e.amount), 0);
  const expPaidFinal = s.expenseLog.filter(e => fin[e.id] && fin[e.id].final === 'Paid').reduce((a, e) => a + num(e.amount), 0);
  const expUnpaidFinal = expTotal - expPaidFinal;
  const dsTotal = s.dieselLog.reduce((a, d) => a + num(d.amount), 0);
  const dsPaid = s.dieselLog.filter(d => st(d) === 'Paid').reduce((a, d) => a + num(d.amount), 0);
  const dsUnpaid = s.dieselLog.filter(d => st(d) === 'Unpaid').reduce((a, d) => a + num(d.amount), 0);
  const dsLitres = s.dieselLog.reduce((a, d) => a + num(d.litres), 0);
  const mu = (s.murumLog || []);
  const muTotal = mu.reduce((a, r) => a + mAmt(r), 0);
  const muPaid = mu.filter(r => st(r) === 'Paid').reduce((a, r) => a + mAmt(r), 0);
  const muUnpaid = muTotal - muPaid;
  const muQty = mu.reduce((a, r) => a + num(r.qty), 0);
  const funds = (s.funds || []).reduce((a, r) => a + num(r.amount), 0);
  const ownerPaid = (s.ownerPayments || []).reduce((a, r) => a + num(r.amount), 0);
  const vp = s.vendorPayments.reduce((a, p) => a + num(p.amount), 0);
  const rent = s.machines.reduce((a, m) => a + machineRent(s, m.no).rent, 0);
  /* payment allocate zalyavar cha khara hishob (diesel ani murum sathi pn) */
  const dsPaidFinal = s.dieselLog.filter(d => fin[d.id] && fin[d.id].final === 'Paid').reduce((a, d) => a + num(d.amount), 0);
  const dsUnpaidFinal = dsTotal - dsPaidFinal;
  const muPaidFinal = mu.filter(m => fin[m.id] && fin[m.id].final === 'Paid').reduce((a, m) => a + mAmt(m), 0);
  const muUnpaidFinal = muTotal - muPaidFinal;
  return {
    fin, expTotal, expPaidDirect, expUnpaidRaw, expPaidFinal, expUnpaidFinal,
    dsPaidFinal, dsUnpaidFinal, muPaidFinal, muUnpaidFinal,
    dsTotal, dsPaid, dsUnpaid, dsLitres, vendorPaid: vp, rent,
    muTotal, muPaid, muUnpaid, muQty, funds, ownerPaid,
    grand: expTotal + dsTotal + rent + muTotal,
    netPending: expUnpaidFinal + dsUnpaidFinal + muUnpaidFinal
  };
}

/* --- per person (Manager Dashboard + naav-nihay sheets) --- */
function personStats(s, name) {
  const siteExp = s.expenseLog.filter(e => st(e) === 'Paid' && e.paidBy === name);
  const diesel = s.dieselLog.filter(d => st(d) === 'Paid' && d.paidBy === name);
  const vpay = s.vendorPayments.filter(p => p.paidBy === name);
  const murum = (s.murumLog || []).filter(m => st(m) === 'Paid' && m.paidBy === name);
  const opay = (s.ownerPayments || []).filter(p => p.paidBy === name);
  const got = (s.funds || []).filter(f => f.person === name);
  const sum = (arr, k) => arr.reduce((a, r) => a + num(r[k]), 0);
  const mu = murum.reduce((a, r) => a + mAmt(r), 0);
  const total = sum(siteExp, 'amount') + sum(diesel, 'amount') + sum(vpay, 'amount') + mu + sum(opay, 'amount');
  const received = sum(got, 'amount');
  return {
    siteExp, diesel, vpay, murum, opay, got,
    site: sum(siteExp, 'amount'), dsl: sum(diesel, 'amount'), vp: sum(vpay, 'amount'),
    mu, op: sum(opay, 'amount'), received, total, balance: received - total,
    getsAdvance: (s.advance || []).includes(name)
  };
}

/* --- per vendor (Vendor Dashboard) --- */
function vendorStats(s, v) {
  const mu = (s.murumLog || []).filter(m => m.vendor === v);
  const ds = (s.dieselLog || []).filter(d => d.vendor === v);
  const total = s.expenseLog.filter(e => e.vendor === v).reduce((a, e) => a + num(e.amount), 0)
    + mu.reduce((a, m) => a + mAmt(m), 0) + ds.reduce((a, d) => a + num(d.amount), 0);
  const direct = s.expenseLog.filter(e => e.vendor === v && st(e) === 'Paid').reduce((a, e) => a + num(e.amount), 0)
    + mu.filter(m => st(m) === 'Paid').reduce((a, m) => a + mAmt(m), 0)
    + ds.filter(d => st(d) === 'Paid').reduce((a, d) => a + num(d.amount), 0);
  const paid = s.vendorPayments.filter(p => p.vendor === v).reduce((a, p) => a + num(p.amount), 0);
  return { total, direct, paid, totalPaid: direct + paid, remaining: total - direct - paid };
}

/* ============================================================
   PAYMENT REMINDERS  —  vendor la dilela date
   ============================================================ */
function dueList(s) {
  return (s.reminders || []).filter(r => !r.done).slice().sort((a, b) => String(a.due).localeCompare(String(b.due)));
}
function dueSoon(s, days) {
  const lim = shiftDay(today(), days == null ? 3 : days);
  return dueList(s).filter(r => r.due && r.due <= lim);
}
const dueLate = r => r.due && r.due < today();
function remVendorStats(s, v) { return isDieselVendor(s, v) ? dieselVendorStats(s, v) : vendorStats(s, v); }
function dueState(d) {
  if (!d) return '';
  const t = today();
  if (d < t) return 'late';
  if (d === t) return 'today';
  return 'soon';
}
/* ya vendor chi aatachi baki */
function vendorDue(s, v) { return remVendorStats(s, v).remaining; }

/* phone chya calendar madhe reminder (ha app band asla tari phone notification deto) */
function icsFor(s, listOrOne) {
  const list = Array.isArray(listOrOne) ? listOrOne : [listOrOne];
  const pad = n => String(n).padStart(2, '0');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Site Manager//MR', 'CALSCALE:GREGORIAN'];
  list.forEach(r => {
    const d = String(r.due || today()).replace(/-/g, '');
    const nx = shiftDay(r.due || today(), 1).replace(/-/g, '');
    L.push('BEGIN:VEVENT');
    L.push('UID:' + r.id + '@sitemanager');
    L.push('DTSTAMP:' + stamp);
    L.push('DTSTART;VALUE=DATE:' + d);
    L.push('DTEND;VALUE=DATE:' + nx);
    L.push('SUMMARY:' + (r.vendor || 'Payment') + ' - ' + money(r.amount || vendorDue(s, r.vendor)));
    L.push('DESCRIPTION:' + (s.name + (r.note ? ' | ' + r.note : '')));
    L.push('BEGIN:VALARM', 'TRIGGER:-PT1H', 'ACTION:DISPLAY', 'DESCRIPTION:Payment reminder', 'END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}

/* app ughadla asel tar phone var notification */
async function notifyDue(s) {
  try {
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    const list = dueList(s).filter(r => r.due && r.due <= today());
    if (!list.length) return;
    const k = 'notif:' + today();
    if (DB.lastNotif === k) return;
    DB.lastNotif = k; save();
    const one = list[0];
    new Notification(s.name + ' - payment', {
      body: list.length === 1
        ? one.vendor + ' : ' + money(one.amount || vendorDue(s, one.vendor)) + ' (' + fmtDate(one.dute) + ')'
        : list.length + ' payment aaj kiwa maage aahet'
    });
  } catch (e) { }
}

/* --- machine owner: rent payable vs dilele paise --- */
function ownerList(s) { return [...new Set(s.machines.map(m => m.owner).filter(Boolean))].sort(); }
function ownerStats(s, owner) {
  const ms = s.machines.filter(m => m.owner === owner);
  const rent = ms.reduce((a, m) => a + machineRent(s, m.no).rent, 0);
  const paid = (s.ownerPayments || []).filter(p => p.owner === owner).reduce((a, p) => a + num(p.amount), 0);
  return { machines: ms, rent, paid, balance: rent - paid };
}

/* --- diesel vendor summary --- */
function dieselVendorStats(s, v) {
  const rows = s.dieselLog.filter(d => d.vendor === v);
  const sum = k => rows.reduce((a, r) => a + num(r[k]), 0);
  const direct = rows.filter(r => st(r) === 'Paid').reduce((a, r) => a + num(r.amount), 0);
  const payments = (s.vendorPayments || []).filter(p => p.vendor === v).reduce((a, p) => a + num(p.amount), 0);
  const amount = sum('amount');
  return {
    litres: sum('litres'), amount, bills: rows.length,
    paid: direct, direct, payments,
    unpaid: rows.filter(r => st(r) === 'Unpaid').reduce((a, r) => a + num(r.amount), 0),
    remaining: amount - direct - payments
  };
}

/* vendor + diesel vendor ekatra yaadi (jyanchi kahi ghadamod aahe) */
function allVendors(s) {
  const out = (s.vendors || []).slice();
  (s.dieselVendors || []).forEach(v => { if (!out.includes(v)) out.push(v); });
  return out;
}
function isDieselVendor(s, v) { return (s.dieselVendors || []).includes(v); }

/* --- category summary --- */
function categoryStats(s, c, fin) {
  const rows = s.expenseLog.filter(e => e.category === c);
  const paid = rows.filter(e => fin[e.id] && fin[e.id].final === 'Paid').reduce((a, e) => a + num(e.amount), 0);
  const total = rows.reduce((a, e) => a + num(e.amount), 0);
  return { entries: rows.length, total, paid, unpaid: total - paid };
}

/* --- last 12 months --- */
function monthSeries(s, fin) {
  const out = []; const d = new Date();
  for (let i = 11; i >= 0; i--) {
    const dt = new Date(d.getFullYear(), d.getMonth() - i, 1);
    const k = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
    const rows = s.expenseLog.filter(e => monthKey(e.date) === k);
    const dsl = s.dieselLog.filter(x => monthKey(x.date) === k).reduce((a, x) => a + num(x.amount), 0);
    const total = rows.reduce((a, e) => a + num(e.amount), 0);
    const paid = rows.filter(e => fin[e.id] && fin[e.id].final === 'Paid').reduce((a, e) => a + num(e.amount), 0);
    out.push({ k, total, paid, unpaid: total - paid, diesel: dsl });
  }
  return out;
}

function navItems(s) {
  const m = s.mods || {};
  const rest = [];
  if (m.machine !== false) rest.push(['machine', 'Machine']);
  if (m.diesel !== false) rest.push(['diesel', 'Diesel']);
  if (m.murum) rest.push(['murum', 'Murum']);
  if (m.stock) rest.push(['stock', 'Stock']);
  rest.push(['expense', 'Expense']);
  if (m.vendor !== false) rest.push(['vendor', 'Vendor']);
  rest.push(['more', 'More']);
  const out = rest.slice();
  out.splice(Math.floor(out.length / 2), 0, ['dash', 'Dashboard']);   /* Dashboard madhe */
  return out;
}

function subsFor(s, t) {
  const m = s.mods || {};
  if (t === 'machine') return [['log', 'Daily log'], ['sum', 'Summary'], ['rent', 'Rent']].concat(m.owner ? [['owner', 'Owner']] : []).concat([['mast', 'Machines']]);
  if (t === 'more') return [['excel', 'Excel']].concat(m.funds ? [['funds', 'Money received']] : []).concat([['person', 'Person-wise'], ['mast', 'Masters'], ['sites', 'Sites']]);
  return SUBS[t];
}
const SUBS = {
  machine: [['log', 'Daily log'], ['sum', 'Summary'], ['rent', 'Rent'], ['mast', 'Machines']],
  diesel: [['log', 'Purchases'], ['sum', 'Summary']],
  expense: [['log', 'Entries'], ['sum', 'Summary']],
  vendor: [['pend', 'Pending'], ['due', 'Due dates'], ['pay', 'Payments'], ['sum', 'Summary']],
  more: [['excel', 'Excel Sync'], ['person', 'Person-wise'], ['mast', 'Masters'], ['sites', 'Sites']]
};
const sub = t => { const l = subsFor(site(), t); return (l && l.some(x => x[0] === UI[t])) ? UI[t] : (l ? l[0][0] : ''); };

function render() {
  const s = site();
  const nav = navItems(s);
  if (!nav.some(x => x[0] === TAB)) TAB = 'dash';
  const subList = subsFor(s, TAB);
  const tabs = subList ? subList.map(([k, l]) => `<button class="chip ${sub(TAB) === k ? 'on' : ''}" data-act="sub" data-v="${k}">${l}</button>`).join('') : '';
  $('#app').innerHTML = `
  <div class="topbar">
    <div class="tb-row">
      ${DB.logo
        ? `<div style="flex:0 0 auto"><img src="${DB.logo}" class="brandlogo" alt=""></div>`
        : '<div class="brand">SITE MANAGER<span>VEERSHREE REALTY ACCOUNT</span></div>'}
      <button class="sitepick" data-act="sites"><b>${esc(s.name)}</b><i>&#9660;</i></button>
    </div>
  </div>
  ${tabs ? `<div class="chips" style="background:#fff;border-bottom:1px solid var(--line)">${tabs}</div>` : ''}
  <main>${STORAGE_OK ? '' : '<div class="warn">This device is not saving data. Download a backup from <b>More &rarr; Excel</b> when you finish.</div>'}
    ${VIEW[TAB](s)}
  </main>
  <nav class="nav n${nav.length}" style="grid-template-columns:repeat(${nav.length},1fr)">${nav.map(([k, l]) => `<button class="${TAB === k ? 'on' : ''}" data-act="tab" data-v="${k}">${ICON[k]}${l}</button>`).join('')}</nav>`;
  try { renderSearch(); } catch (e) { }
  window.scrollTo(0, 0);
}
