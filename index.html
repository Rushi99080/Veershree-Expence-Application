/* ---------- divas cha hishob (daily register) ---------- */
function dayRegister(s, d) {
  const day = d || today();
  const exp = s.expenseLog.filter(e => e.date === day);
  const mu = (s.murumLog || []).filter(r => r.date === day);
  const ds = s.dieselLog.filter(r => r.date === day);
  const vp = s.vendorPayments.filter(r => r.date === day);
  const got = (s.funds || []).filter(r => r.date === day);
  const spentTill = k => k;
  const before = (arr, amtFn) => arr.filter(r => r.date && r.date < day).reduce((a, r) => a + amtFn(r), 0);
  const prevIn = before(s.funds || [], r => num(r.amount));
  const prevOut = before(s.expenseLog.filter(e => st(e) === 'Paid'), r => num(r.amount))
    + before((s.murumLog || []).filter(r => st(r) === 'Paid'), mAmt)
    + before(s.dieselLog.filter(r => st(r) === 'Paid'), r => num(r.amount))
    + before(s.vendorPayments, r => num(r.amount)) + before(s.ownerPayments || [], r => num(r.amount));
  const dayOut = exp.filter(e => st(e) === 'Paid').reduce((a, r) => a + num(r.amount), 0)
    + mu.filter(r => st(r) === 'Paid').reduce((a, r) => a + mAmt(r), 0)
    + ds.filter(r => st(r) === 'Paid').reduce((a, r) => a + num(r.amount), 0)
    + vp.reduce((a, r) => a + num(r.amount), 0);
  const dayIn = got.reduce((a, r) => a + num(r.amount), 0);
  const L = [];
  L.push('*' + s.name + '*');
  L.push(fmtDate(day));
  if (s.mods.funds) { L.push(''); L.push('Previous balance : ' + money(prevIn - prevOut)); L.push('Received : ' + money(dayIn)); }
  L.push('');
  exp.forEach(e => L.push((e.desc || e.category) + ' - ' + money(e.amount) + (st(e) === 'Unpaid' ? ' (on credit)' : '')));
  mu.forEach(r => L.push('Murum ' + dec(r.qty) + ' ' + (s.murumUnit || 'Brass') + ' - ' + money(mAmt(r)) + (st(r) === 'Unpaid' ? ' (on credit)' : '')));
  ds.forEach(r => L.push('Diesel ' + dec(r.litres) + ' L (' + r.vendor + ') - ' + money(r.amount) + (st(r) === 'Unpaid' ? ' (on credit)' : '')));
  vp.forEach(r => L.push(r.vendor + ' payment - ' + money(r.amount)));
  if (!exp.length && !mu.length && !ds.length && !vp.length) L.push('(no expenses on this day)');
  L.push('');
  L.push('*Total expense : ' + money(dayOut) + '*');
  if (s.mods.funds) L.push('*Remaining : ' + money(prevIn - prevOut + dayIn - dayOut) + '*');
  return L.join('\n');
}

function exportCsv(kind) {

    rows = s.expenseLog.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).map(e => [e.date, e.category, e.desc, e.vendor, e.amount, e.status, e.paidBy, fin[e.id].final, fin[e.id].by, e.remark]);
  } else if (kind === 'machine') {

    rows = s.machineLog.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).map(r => [r.date, r.machineNo, machineType(s, r.machineNo), r.inR, r.outR, hoursOf(r), r.diesel, r.remark]);

  }
  const csv = '\uFEFF' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');

function readFileText(f) {

    rd.onload = () => res(String(rd.result).replace(/^\uFEFF/, ''));
    rd.onerror = () => rej(new Error(f.name));
    rd.readAsText(f);
  });
}

function importSupervisor(s) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json'; inp.multiple = true;
  inp.onchange = async () => {
    const files = Array.from(inp.files || []);
    if (!files.length) return;
    files.sort((a, b) => String(a.name).localeCompare(String(b.name)));
    toast(files.length + ' file vachtoy...');

    const packs = [], bad = [];
    for (const f of files) {
      let d = null;
      try { d = JSON.parse(await readFileText(f)); } catch (e) { bad.push(f.name); continue; }
      if (!d || (d.type !== 'sup-log' && d.type !== 'sup-machine-log')) { bad.push(f.name); continue; }
      const m = d.machineRows || d.rows || [], dl = d.dieselRows || [];
      if (!m.length && !dl.length) { bad.push(f.name); continue; }
      packs.push({ name: f.name, d, m, dl });
    }
    if (!packs.length) {
      return alert('Ek pn Reading Book chi file sapadli nahi.' + (bad.length ? '\n\n' + bad.length + ' file chalali nahi.' : ''));
    }

    const mTot = packs.reduce((a, p) => a + p.m.length, 0);
    const dTot = packs.reduce((a, p) => a + p.dl.length, 0);
    const days = [...new Set([].concat(...packs.map(p => p.m.map(r => r.date).concat(p.dl.map(r => r.date)))))].filter(Boolean).sort();
    const sups = [...new Set(packs.map(p => p.d.supervisor).filter(Boolean))];
    const msg = packs.length + ' file\n' + mTot + ' machine entries, ' + dTot + ' diesel bills\n' +
      (days.length ? days.length + ' divas (' + fmtDate(days[0]) + ' te ' + fmtDate(days[days.length - 1]) + ')\n' : '') +
      (sups.length ? 'Supervisor: ' + sups.join(', ') + '\n' : '') +
      (bad.length ? '\n' + bad.length + ' file chalali nahi, ti sodli.\n' : '') +
      '\n"' + s.name + '" madhe ghyaychya?';
    if (!confirm(msg)) return;

    /* aadhi juna data snapshot madhe */
    try { await Store.snapshot(JSON.stringify(DB)); } catch (e) { }

    let mAdd = 0, mDup = 0, newM = 0, dAdd = 0, dDup = 0, newV = 0, newP = 0;
    /* patkan duplicate tapasnyasathi key set */
    const mKey = {}; s.machineLog.forEach(x => mKey[x.date + '|' + x.machineNo] = 1);
    const dKey = {}; s.dieselLog.forEach(x => dKey[x.date + '|' + x.vendor + '|' + num(x.litres) + '|' + num(x.amount)] = 1);
    const mNo = {}; s.machines.forEach(m => mNo[m.no] = 1);
    const dvSet = {}; s.dieselVendors.forEach(v => dvSet[v] = 1);
    const pSet = {}; s.people.forEach(p => pSet[p] = 1);
    const rmSet = {}; s.rateMaster.forEach(r => rmSet[r.type] = 1);

    packs.forEach(p => {
      p.m.forEach(r => {
        if (!r.machineNo || !r.date) return;
        const k = r.date + '|' + r.machineNo;
        if (mKey[k]) { mDup++; return; }
        mKey[k] = 1;
        if (!mNo[r.machineNo]) {
          const type = r.type || '';
          if (type && !rmSet[type]) { s.rateMaster.push({ type, basis: type === 'Hiwa' ? 'Daily' : 'Hourly', packageRate: 0, packageUnits: type === 'Hiwa' ? 30 : 240 }); rmSet[type] = 1; }
          s.machines.push({ id: uid(), no: r.machineNo, type, owner: '', operator: '', make: '', monthlyRate: '' });
          mNo[r.machineNo] = 1; newM++;
        }
        s.machineLog.push({ id: uid(), date: r.date, machineNo: r.machineNo,
          inR: has(r.inR) ? num(r.inR) : '', outR: has(r.outR) ? num(r.outR) : '',
          diesel: has(r.diesel) ? num(r.diesel) : '', remark: r.remark || '' });
        mAdd++;
      });
      p.dl.forEach(r => {
        if (!r.date) return;
        const k = r.date + '|' + (r.vendor || '') + '|' + num(r.litres) + '|' + num(r.amount);
        if (dKey[k]) { dDup++; return; }
        dKey[k] = 1;
        if (r.vendor && !dvSet[r.vendor]) { s.dieselVendors.push(r.vendor); dvSet[r.vendor] = 1; newV++; }
        if (r.paidBy && !pSet[r.paidBy]) { s.people.push(r.paidBy); pSet[r.paidBy] = 1; newP++; }
        s.dieselLog.push({ id: uid(), date: r.date, vendor: r.vendor || '',
          litres: has(r.litres) ? num(r.litres) : '', bill: r.bill || '',
          amount: has(r.amount) ? num(r.amount) : '',
          status: String(r.status || '').toLowerCase() === 'paid' ? 'Paid' : 'Unpaid',
          paidBy: r.paidBy || '', remark: r.remark || '' });
        dAdd++;
      });
    });

    migrate();
    await save(); render();
    alert(packs.length + ' file ghetlya.\n\n' +
      mAdd + ' machine entries ani ' + dAdd + ' diesel bills add zale.' +
      ((mDup || dDup) ? '\n' + (mDup + dDup) + ' aadhich hote, te sodle.' : '') +
      (newM ? '\n' + newM + ' navin machine add zalya - tyanche rate bhara.' : '') +
      (newV ? '\n' + newV + ' navin diesel vendor add zale.' : '') +
      (newP ? '\n' + newP + ' navin naav add zale.' : '') +
      (bad.length ? '\n\n' + bad.length + ' file chalali nahi.' : ''));
  };
  inp.click();
}

}

function redrawArrange(s) {
  const box = document.getElementById('alist');
  if (box) { box.innerHTML = arrangeRows(s); bindDrag(s); }
}

function bindDrag(s) {
  const box = document.getElementById('alist');
  if (!box || !box.querySelectorAll) return;
  const rows = Array.from(box.querySelectorAll('.arow') || []);
  let drag = null;
  const start = (row, y) => { drag = { row, from: +row.dataset.i, y0: y, moved: 0 }; row.classList.add('drag'); };
  const move = y => {
    if (!drag) return;
    const dy = y - drag.y0;
    drag.row.style.transform = 'translateY(' + dy + 'px)';
    drag.moved = Math.round(dy / (drag.row.offsetHeight || 52));
  };
  const end = () => {
    if (!drag) return;
    const to = Math.max(0, Math.min(AORDER.length - 1, drag.from + drag.moved));
    drag.row.classList.remove('drag');
    drag.row.style.transform = '';
    if (to !== drag.from) {
      const [x] = AORDER.splice(drag.from, 1);
      AORDER.splice(to, 0, x);
      redrawArrange(s);
    }
    drag = null;
  };
  rows.forEach(row => {
    row.addEventListener('touchstart', e => { if (e.target.closest('[data-act]')) return; start(row, e.touches[0].clientY); }, { passive: true });
    row.addEventListener('touchmove', e => { if (drag) { e.preventDefault(); move(e.touches[0].clientY); } }, { passive: false });
    row.addEventListener('touchend', end);
    row.addEventListener('touchcancel', end);
    row.addEventListener('mousedown', e => { if (e.target.closest('[data-act]')) return; start(row, e.clientY); });
  });
  document.addEventListener('mousemove', e => { if (drag) move(e.clientY); });
  document.addEventListener('mouseup', end);
}

let PENDING_IMPORT = null;

/* file madhun sites kaadhto — juna format, navin format, ek site, sites chi yaadi */
function readSites(d) {
  if (!d || typeof d !== 'object') return null;
  if (Array.isArray(d)) return d.filter(x => x && x.expenseLog !== undefined || x && x.name);
  if (Array.isArray(d.sites)) return d.sites;
  if (d.site && typeof d.site === 'object' && d.site.name) return [d.site];
  if (d.name && (d.expenseLog || d.machineLog || d.machines)) return [d];      /* ek site ch aahe */
  return null;
}

function importJson(fromLock) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json,application/octet-stream';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onerror = () => alert('File vachta ali nahi. Parat try kara.');
    rd.onload = async () => {
      let d;
      try { d = JSON.parse(String(rd.result).replace(/^\uFEFF/, '')); }
      catch (e) { return alert('Hi file vachta ali nahi.\n\nJi file ya app madhun "Backup download" ne kadhli aahe tich nivda.'); }
      if (d && (d.type === 'sup-log' || d.type === 'sup-machine-log')) {
        return alert('Hi backup file nahi.');
      }
      const sites = readSites(d);
      if (!sites || !sites.length) return alert('Ya file madhe ek pn site sapadli nahi.');
      const clean = sites.map(s => normSite(JSON.parse(JSON.stringify(s)))).filter(Boolean);
      if (!clean.length) return alert('Ya file madhla data vachta ala nahi.');
      const has = DB.sites && DB.sites.some(s => s.expenseLog.length || s.machineLog.length || s.dieselLog.length || s.murumLog.length);
      if (!has || fromLock) { await applyImport(clean, false); return; }
      PENDING_IMPORT = clean;
      const list = clean.map(s => {
        const t = totals(s);
        return `<div class="row"><div class="main"><div class="ttl">${esc(s.name)}</div>
          <div class="sub">${s.expenseLog.length} kharch &middot; ${s.machineLog.length} machine &middot; ${s.dieselLog.length} diesel${s.murumLog.length ? ' &middot; ' + s.murumLog.length + ' murum' : ''}</div></div>
          <div class="amt">${money(t.grand)}</div></div>`;
      }).join('');
      const same = clean.filter(s => DB.sites.some(x => x.name.trim().toLowerCase() === s.name.trim().toLowerCase()));
      openSheet('File madhe kaay aahe', `
        <div class="card">${list}</div>
        <div class="card"><div class="pad">
          <div class="tiny" style="margin-bottom:10px;line-height:1.8">
            <b>Add kara</b> &mdash; ya sites tumchya aatachya ${DB.sites.length} site sobat add hotil. <b>Juna kahich jaat nahi.</b><br>
            <b>Sagla data badla</b> &mdash; aatacha sagla data javun fakt ya file madhla rahil.<br>
            <span style="color:var(--steel)">जोडा — जुने काही जात नाही.</span>
          </div>
          ${same.length ? `<div class="warn" style="margin-bottom:10px">"${esc(same[0].name)}" ya naavachi site aadhich aahe. Add kelya var ti <b>(2)</b> mhanun vegli disel &mdash; donhi rahtil.</div>` : ''}
          <button class="btn" data-act="impAdd">Add kara<i>जोडा — जुने राहील</i></button>
          <div class="btnrow"><button class="btn dgr sm" style="flex:1" data-act="impReplace">Sagla data badla<i>सगळे बदला</i></button></div>
          <div class="tiny" style="margin-top:8px">Kahihi kelе tari aatacha data aadhi snapshot madhe theva jato &mdash; Data safety madhun parat aanta yeto.</div>
        </div></div>`, null, null);
    };
    rd.readAsText(f);
  };
  inp.click();
}

async function applyImport(clean, add) {
  try { await Store.snapshot(JSON.stringify(DB)); } catch (e) { }   /* badalnyaadhi juna data suraksit */
  if (add) {
    clean.forEach(s => {
      let nm = s.name, n = 2;
      while (DB.sites.some(x => x.name.trim().toLowerCase() === nm.trim().toLowerCase())) nm = s.name + ' (' + (n++) + ')';
      s.name = nm;
      while (DB.sites.some(x => x.id === s.id)) s.id = uid();
      DB.sites.push(s);
    });
    DB.activeId = DB.sites[DB.sites.length - 1].id;
  } else {
    DB = { sites: clean, activeId: clean[0].id, delPass: DB.delPass, lastSnap: null };
  }
  migrate(); UI = {}; TAB = 'dash';
  closeSheet(); await save(); render();
  toast(add ? clean.length + ' site add zali' : 'Import zala');
}

    case 'mArrange': arrangeForm(s); break;
    case 'aUp': case 'aDn': {
      const i = +v, j = a === 'aUp' ? i - 1 : i + 1;
      if (j < 0 || j >= AORDER.length) break;
      const t = AORDER[i]; AORDER[i] = AORDER[j]; AORDER[j] = t;
      redrawArrange(s);
      break;
    }
    case 'mBill':
      if (!v) { toast('Machine nivda'); break; }
      openBill(machineBill(s, v), 'machine-' + v);
      render(); break;
    case 'vBill':
      if (!v) break;
      openBill(vendorBill(s, v), 'vendor-' + v);
      render(); break;
    case 'prtGo': try { window.print(); } catch (e) { toast('Print jamla nahi'); } break;
    case 'prtClose': closeBill(); render(); break;
    case 'mDelOne': {
      const m = s.machines.find(x => x.id === v);
      if (!m) break;
      const list = s.machineLog.filter(l => l.machineNo === m.no);
      const hrs = list.reduce((a, l) => a + hoursOf(l), 0);
      if (!list.length) {
        if (!confirm(m.no + ' delete karaychi?')) break;
      } else {
        const both = confirm(m.no + ' chya ' + list.length + ' log entries (' + dec(hrs) + ' hours) aahet.\n\nOK = machine ANI tichya saglya entries delete kara.\nCancel = fakt machine kaadha, entries rahtil.');
        if (both) s.machineLog = s.machineLog.filter(l => l.machineNo !== m.no);
      }
      s.machines = s.machines.filter(x => x.id !== m.id);
      await save(); render(); toast(m.no + ' delete zali');
      break;
    }
    case 'rmEdit': rateForm(s, +v); break;
    case 'listAdd': listForm(s, v, null); break;
    case 'listEdit': { const [k, i] = v.split(':'); listForm(s, k, +i); break; }
    case 'sites': sitePicker(); break;
    case 'siteAdd': closeSheet(); siteForm(null); break;
    case 'siteEdit': siteForm(v); break;
    case 'siteDel': siteDeleteForm(v); break;
    case 'delPassSet': delPassForm(false); break;
    case 'delPassChange': delPassForm(true); break;
    case 'delPassForgot': {
      if (!confirm('Delete password reset karaycha?\n\nHa password fakt chukun site delete hou naye mhanun aahe. Reset kelyavar kuthlahi password nasel - mag navin thevta yeto.\n\nPudhe jaayche?')) break;
      download('Site_Manager_backup_' + today() + '.json', JSON.stringify(DB), 'application/json');
      if (!confirm('Aadhi backup download zala aahe (Downloads madhe bagha).\n\nAata password kaadhtoy - nakki?')) break;
      delete DB.delPass;
      closeSheet(); await save(); render();
      alert('Password kaadhla.\n\nAata More > Sites madhun navin password thevaa, kiwa site delete kartana tithech navin thevta yeil.');
      break;
    }
    case 'siteGo': DB.activeId = v; UI = {}; TAB = 'dash'; closeSheet(); await save(); render(); toast('Site changed'); break;
    case 'xlsx': exportExcel(s); break;
    case 'xlRow': break;
    case 'xlCopy': xlCopySheet(s, el.dataset.k); break;
    case 'xlClip': {
      const box = document.getElementById('f_blk');
      box.focus(); box.setSelectionRange(0, box.value.length);
      try { await navigator.clipboard.writeText(box.value); toast('Copied'); }
      catch (err) { try { document.execCommand('copy'); toast('Copied'); } catch (e2) { toast('Text selected - long press to copy'); } }
      break;
    }
    case 'xlFile': {
      const k = el.dataset.k, x = XL[k], start = num(s.xlRows[k]) || x.first;
      download(x.sheet.replace(/ /g, '_') + '_row' + start + '.csv',
        '\uFEFF' + xlBlock(s, k, start).split('\n').map(l => l.split('\t').map(csvCell).join(',')).join('\r\n'),
        'text/csv;charset=utf-8');
      toast('File downloaded');
      break;
    }
    case 'xlAllDone':
      if (!confirm('Mark all new entries as added to Excel?')) break;
      Object.keys(XL).forEach(k => markDone(s, k));
      await save(); render(); toast('Marked');
      break;
    case 'xlReset':
      if (!confirm('Mark every entry as not yet in Excel?')) break;
      Object.keys(XL).forEach(k => { s[k].forEach(r => { delete r.xl; }); s.xlRows[k] = XL[k].first; });
      await save(); render(); toast('Reset done');
      break;
    case 'snapList': UI.snaps = await Store.snapshots(); render(); break;
    case 'snapBack': {
      const raw = await Store.snapshotGet(v);
      if (!raw) { toast('Snapshot not found'); break; }
      if (!confirm('Restore the data from ' + fmtDate(v.slice(5)) + '? Current data will be replaced.')) break;
      DB = JSON.parse(raw); migrate();
      if (!DB.sites.find(x => x.id === DB.activeId)) DB.activeId = DB.sites[0].id;
      await save(); UI = {}; render(); toast('Restored');
      break;
    }
    case 'expJson': download('site-manager-backup-' + today() + '.json', JSON.stringify(DB), 'application/json'); toast('Backup downloaded'); break;
    case 'impJson': importJson(); break;
    case 'impSup': importSupervisor(s); break;
    case 'supOpen': window.open(supLink(), '_blank'); break;
    case 'supLinkCopy': {
      const box = document.getElementById('f_suplink');
      try { box.focus(); box.setSelectionRange(0, box.value.length); } catch (er) { }
      try { await navigator.clipboard.writeText(supLink()); toast('Link copy zala'); }
      catch (er) { toast('Link select zala - long press karun copy kara'); }
      break;
    }
    case 'supLinkWa':
      window.open('https://wa.me/?text=' + encodeURIComponent('Reading Book app - roj machine reading ani diesel ithe bhara:\n' + supLink()), '_blank');
      break;
    case 'impAdd': if (PENDING_IMPORT) { const d = PENDING_IMPORT; PENDING_IMPORT = null; await applyImport(d, true); } break;
    case 'impReplace':
      if (PENDING_IMPORT && confirm('Aatacha sagla data jail ani fakt ya file madhla rahil. Nakki?')) {
        const d = PENDING_IMPORT; PENDING_IMPORT = null; await applyImport(d, false);
      }
      break;
    case 'expJson': download('site-manager-backup-' + today() + '.json', JSON.stringify(DB), 'application/json'); toast('Backup downloaded'); break;
    case 'impJson': importJson(); break;
    case 'impAdd': if (PENDING_IMPORT) { const d = PENDING_IMPORT; PENDING_IMPORT = null; await applyImport(d, true); } break;
    case 'impReplace':
      if (PENDING_IMPORT && confirm('Aatacha sagla data jail ani fakt ya file madhla rahil. Nakki?')) {
        const d = PENDING_IMPORT; PENDING_IMPORT = null; await applyImport(d, false);
      }
      break;
    case 'expJson': download('site-manager-backup-' + today() + '.json', JSON.stringify(DB), 'application/json'); toast('Backup downloaded'); break;
    case 'impJson': importJson(); break;
    case 'impAdd': if (PENDING_IMPORT) { const d = PENDING_IMPORT; PENDING_IMPORT = null; await applyImport(d, true); } break;
    case 'impReplace':
      if (PENDING_IMPORT && confirm('Aatacha sagla data jail ani fakt ya file madhla rahil. Nakki?')) {
        const d = PENDING_IMPORT; PENDING_IMPORT = null; await applyImport(d, false);
      }
      break;
    case 'expJson': download('site-manager-backup-' + today() + '.json', JSON.stringify(DB), 'application/json'); toast('Backup downloaded'); break;
    case 'impJson': importJson(); break;
    case 'impAdd': if (PENDING_IMPORT) { const d = PENDING_IMPORT; PENDING_IMPORT = null; await applyImport(d, true); } break;
    case 'impReplace':
      if (PENDING_IMPORT && confirm('Aatacha sagla data jail ani fakt ya file madhla rahil. Nakki?')) {
        const d = PENDING_IMPORT; PENDING_IMPORT = null; await applyImport(d, false);
      }
      break;
    case 'expCsv': exportCsv(v); break;
    case 'share': {
      const txt = shareText();
      try { await navigator.clipboard.writeText(txt); toast('Summary copied'); } catch (err) { }
      window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
      break;
    }
  }
});

document.addEventListener('change', e => {
  const md = e.target.closest('[data-act="mlDateIn"]');
  if (md) { UI.mlDate = md.value || ''; UI.mlFilter = ''; UI.mlMore = 0; render(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'xlRow') { const s = site(); s.xlRows[el.dataset.k] = num(el.value) || XL[el.dataset.k].first; save(); render(); }
  if (a === 'rentMachine') { UI.rentMachine = el.value; render(); }
  if (a === 'rentFrom') { UI.rentFrom = el.value; render(); }
  if (a === 'rentTo') { UI.rentTo = el.value; render(); }
});

/* ---------- go ---------- */
(async () => { await load(); render(); try { notifyDue(site()); } catch (e) { } })();

</script>
