VIEW.dash = s => {
  const t = totals(s);
  const rentRows = s.machines.map(m => ({ m, r: machineRent(s, m.no) })).filter(x => x.r.entries > 0).sort((a, b) => b.r.rent - a.r.rent);
  const people = s.people.map(p => ({ p, ps: personStats(s, p) }));
  return `
  <div class="hero">
    <div class="lbl">TOTAL PLOT EXPENSE<i>एकूण खर्च</i></div>
    <div class="big"><small>&#8377;</small>${money0(t.grand)}</div>
    <div class="hsplit" style="grid-template-columns:repeat(${3 + (s.mods.murum ? 1 : 0)},1fr)">
      <div><div class="k">SITE<i>साइट</i></div><div class="v num">${money0(t.expTotal)}</div></div>
      ${s.mods.murum ? `<div><div class="k">MURUM<i>मुरुम</i></div><div class="v num">${money0(t.muTotal)}</div></div>` : ''}
      <div><div class="k">DIESEL<i>डिझेल</i></div><div class="v num">${money0(t.dsTotal)}</div></div>
      <div><div class="k">MACHINE RENT<i>मशीन भाडे</i></div><div class="v num">${money0(t.rent)}</div></div>
    </div>
    <div class="pendbar"><span style="font-size:12px;font-weight:700;letter-spacing:.04em">NET PENDING<i>बाकी</i></span><b class="num">${money(t.netPending)}</b></div>
  </div>

  <div class="card">
    <h3>Expense head-wise<i>हेड नुसार खर्च</i></h3>
    <div class="scroll"><table>
      <thead><tr><th>Head</th><th class="n">Total</th><th class="n">Paid</th><th class="n">Pending</th></tr></thead>
      <tbody>
        <tr><td>Site expense</td><td class="n">${money0(t.expTotal)}</td><td class="n">${money0(t.expPaidFinal)}</td><td class="n">${money0(t.expUnpaidFinal)}</td></tr>
        ${s.mods.murum ? `<tr><td>Murum <span class="tiny">(${dec(t.muQty)} ${esc(s.murumUnit)})</span></td><td class="n">${money0(t.muTotal)}</td><td class="n">${money0(t.muPaidFinal)}</td><td class="n">${money0(t.muUnpaidFinal)}</td></tr>` : ''}
        ${s.mods.diesel !== false ? `<tr><td>Diesel purchase</td><td class="n">${money0(t.dsTotal)}</td><td class="n">${money0(t.dsPaidFinal)}</td><td class="n">${money0(t.dsUnpaidFinal)}</td></tr>` : ''}
      </tbody>
      <tfoot><tr><td>NET</td><td class="n">${money0(t.expTotal + t.muTotal + t.dsTotal)}</td><td class="n">${money0(t.expPaidFinal + t.muPaidFinal + t.dsPaidFinal)}</td><td class="n">${money0(t.netPending)}</td></tr></tfoot>
    </table></div>
    <div class="pad tiny">Vendor payments (${money(t.vendorPaid)}) tya-tya head madhe apoap dharle aahet.${s.mods.machine !== false ? ' Machine rent ' + money(t.rent) + ' vegla &mdash; Machine tab madhe.' : ''}</div>
  </div>

  <div class="card">
    <h3>Manager-wise spending<i>मॅनेजर नुसार खर्च</i></h3>
    <div class="scroll"><table>
      <thead><tr><th>Name</th>${s.mods.funds ? '<th class="n">Received</th>' : ''}<th class="n">Site</th><th class="n">Diesel</th><th class="n">Vendor</th><th class="n">Total</th>${s.mods.funds ? '<th class="n">Balance</th>' : ''}</tr></thead>
      <tbody>${people.map(x => `<tr><td class="nowrap">${esc(x.p)}</td>${s.mods.funds ? `<td class="n">${x.ps.getsAdvance ? money0(x.ps.received) : '<span class="tiny">—</span>'}</td>` : ''}<td class="n">${money0(x.ps.site + x.ps.mu)}</td><td class="n">${money0(x.ps.dsl)}</td><td class="n">${money0(x.ps.vp + x.ps.op)}</td><td class="n"><b>${money0(x.ps.total)}</b></td>${s.mods.funds ? `<td class="n">${x.ps.getsAdvance ? '<b style="color:' + (x.ps.balance < 0 ? 'var(--due)' : 'var(--paid)') + '">' + money0(x.ps.balance) + '</b>' : '<span class="tiny">—</span>'}</td>` : ''}</tr>`).join('') || '<tr><td colspan="6" class="muted">Add names in Masters.<i>मास्टरमध्ये नाव जोडा</i></td></tr>'}</tbody>
      <tfoot><tr><td>TOTAL<i>एकूण</i></td>${s.mods.funds ? `<td class="n">${money0(people.reduce((a, x) => a + (x.ps.getsAdvance ? x.ps.received : 0), 0))}</td>` : ''}<td class="n">${money0(people.reduce((a, x) => a + x.ps.site + x.ps.mu, 0))}</td><td class="n">${money0(people.reduce((a, x) => a + x.ps.dsl, 0))}</td><td class="n">${money0(people.reduce((a, x) => a + x.ps.vp + x.ps.op, 0))}</td><td class="n">${money0(people.reduce((a, x) => a + x.ps.total, 0))}</td>${s.mods.funds ? `<td class="n">${money0(people.reduce((a, x) => a + (x.ps.getsAdvance ? x.ps.balance : 0), 0))}</td>` : ''}</tr></tfoot>
    </table></div>
  </div>

  <div class="card">
    <h3>Machine-wise<i>मशीन नुसार</i> rent<i>मशीन नुसार भाडे</i><small>from machine log hours</small></h3>
    ${rentRows.length ? `<div class="scroll"><table>
      <thead><tr><th>Machine</th><th>Basis</th><th class="n">Rate</th><th class="n">Hr / days</th><th class="n">Rent</th></tr></thead>
      <tbody>${rentRows.map(x => `<tr><td class="nowrap"><b>${esc(x.m.no)}</b><div class="tiny">${esc(x.m.type)}</div></td><td class="tiny">${esc(x.r.basis)}</td><td class="n">${x.r.unit ? dec(x.r.unit, 0) : '<span class="tiny">no rate</span>'}</td><td class="n">${dec(x.r.qty)}</td><td class="n"><b>${money0(x.r.rent)}</b></td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="4">TOTAL RENT</td><td class="n">${money0(t.rent)}</td></tr></tfoot>
    </table></div>` : '<div class="empty">Rent appears here once machine log entries are added.<i>मशीन लॉग भरल्यावर भाडे दिसेल</i></div>'}
    ${t.rent === 0 && s.machineLog.length ? '<div class="pad tiny">Rent shows 0 because no rates are filled in the Rate Master. Add them under <b>Machine &rarr; Machines</b>.<i>रेट मास्टरमध्ये रेट भरा</i></div>' : ''}
  </div>

  ${(() => {
    const d = dueSoon(s, 3);
    if (!d.length) return '';
    const late = d.filter(dueLate);
    return `<div class="card" style="border-color:${late.length ? 'var(--due)' : 'var(--hivis)'}">
      <h3>${late.length ? 'Payment cha divas talun gela' : 'Payment cha divas aala'}<i>${late.length ? 'तारीख उलटली' : 'पेमेंटची तारीख'}</i><small>${d.length}</small></h3>
      ${d.slice(0, 6).map(r => `<div class="row" data-act="remEdit" data-v="${r.id}">
        <div class="main"><div class="ttl">${esc(r.vendor || r.note || 'Payment')} ${dueLate(r) ? '<span class="pill u">talun gela</span>' : '<span class="pill n">' + fmtDate(r.due) + '</span>'}</div>
        <div class="sub">${dueLate(r) ? fmtDate(r.due) + ' &middot; ' : ''}${r.vendor ? 'baki ' + money(remVendorStats(s, r.vendor).remaining) : ''}${r.note ? ' &middot; ' + esc(r.note) : ''}</div></div>
        <div class="amt">${num(r.amount) ? money0(r.amount) : ''}</div></div>`).join('')}
      <div class="pad"><button class="btn sm" style="width:100%" data-act="sub" data-v="due" data-t="vendor">View all<i>सगळे बघा</i></button></div>
    </div>`;
  })()}
  ${DB.lastBackup === today() ? '' : `<div class="card"><h3>Daily backup<i>आजचा बॅकअप</i></h3><div class="pad">
    <div class="tiny" style="margin-bottom:8px">Roj ek tap &mdash; file phone chya <b>Downloads</b> madhe tarkhesakat save hote.</div>
    <button class="btn sm" style="width:100%" data-act="dayBackup">Download today's backup<i>बॅकअप घ्या</i></button>
  </div></div>`}
  ${pendingCount(s) ? `<div class="card"><h3>Excel sync<i>एक्सेल सिंक</i><small>${pendingCount(s)} new entries</small></h3><div class="pad"><div class="tiny" style="margin-bottom:8px">These entries have not gone into your Excel sheet yet.</div><button class="btn sm" style="width:100%" data-act="sub" data-v="excel" data-t="more">Add to Excel<i>एक्सेलमध्ये टाका</i></button></div></div>` : ''}
  <div class="btnrow" style="margin-bottom:12px">
    <button class="btn sec sm" style="flex:1" data-act="share">Share summary<i>सारांश पाठवा</i></button>
    <button class="btn sec sm" style="flex:1" data-act="dayReg">Daily report<i>दिवसाचा हिशोब</i></button>
  </div>`;
};

/* ---------------- MACHINE ---------------- */
VIEW.machine = s => {
  const k = sub('machine');
  if (k === 'owner') return ownerView(s);
  if (k === 'log') return machineLogView(s);
  if (k === 'sum') return machineSumView(s);
  if (k === 'rent') return machineRentView(s);
  return machineMasterView(s);
};

function machineLogView(s) {
  const f = UI.mlFilter || '';
  const day = UI.mlDate || '';
  let rows = s.machineLog.slice().sort(byDateDesc);
  if (day) rows = rows.filter(r => r.date === day);            /* aadhi tarikh */
  const dayRows = rows.slice();                                 /* tya tarkhechi sagli */
  if (f === '__none') rows = rows.filter(r => !r.machineNo);
  else if (f) rows = rows.filter(r => r.machineNo === f);
  const noMachine = dayRows.filter(r => !r.machineNo).length;
  /* tarikh nivadli asel tar fakt tya divshi chalalelya machine dakhva */
  const chipList = day
    ? s.machines.filter(m => dayRows.some(r => sameNo(r.machineNo, m.no)))
    : s.machines;
  const shown = rows.slice(0, UI.mlMore || 60);
  const hrs = rows.reduce((a, r) => a + hoursOf(r), 0), dsl = rows.reduce((a, r) => a + num(r.diesel), 0);
  const lph = hrs ? dsl / hrs : 0;
  return `
  <button class="btn" data-act="mlAdd">+ Machine entry<i>मशीन एंट्री</i></button>
  <div class="kpis mt">
    <div class="kpi"><div class="k">ENTRIES<i>एंट्री</i></div><div class="v num">${rows.length}</div></div>
    <div class="kpi b"><div class="k">TOTAL HOURS<i>एकूण तास</i></div><div class="v num">${dec(hrs)}</div></div>
    <div class="kpi"><div class="k">DIESEL (L)<i>डिझेल लिटर</i></div><div class="v num">${dec(dsl)}</div></div>
    <div class="kpi b"><div class="k">DIESEL / HOUR<i>तासाला डिझेल</i></div><div class="v num">${lph ? dec(lph, 2) : '—'}</div></div>
  </div>
  <div class="card"><div class="pad" style="padding-bottom:10px">
    <div class="f2" style="align-items:end">
      <div class="field" style="margin:0"><label>Date<i>तारीख</i></label>
        <input type="date" id="ml_date" value="${esc(day)}" data-act="mlDateIn"></div>
      <div class="field" style="margin:0">
        <button class="btn sec sm" style="width:100%" data-act="mlDateClear">${day ? 'Sagle divas dakhva' : 'Aaj cha divas'}<i>${day ? 'सर्व दिवस' : 'आजचा दिवस'}</i></button></div>
    </div>
    ${day ? `<div class="tiny" style="margin-top:8px">${fmtDate(day)} &mdash; <b>${chipList.length}</b> machine chalalya, ${dayRows.length} entries.</div>` : ''}
  </div></div>
  <div class="card">
    <div class="chips">
      <button class="chip ${!f ? 'on' : ''}" data-act="mlFilter" data-v="">All${day ? ' (' + dayRows.length + ')' : ''}</button>
      ${noMachine ? `<button class="chip ${f === '__none' ? 'on' : ''}" data-act="mlFilter" data-v="__none">No machine (${noMachine})</button>` : ''}
      ${chipList.map(m => `<button class="chip ${f === m.no ? 'on' : ''}" data-act="mlFilter" data-v="${esc(m.no)}">${esc(m.no)}${day ? ' (' + dayRows.filter(r => sameNo(r.machineNo, m.no)).length + ')' : ''}</button>`).join('')}
    </div>
    ${shown.length ? shown.map(r => {
      const h = hoursOf(r);
      return `<div class="row" data-act="mlEdit" data-v="${r.id}">
        <div class="main">
          <div class="ttl">${r.machineNo ? esc(r.machineNo) + ' <span class="pill n">' + esc(machineType(s, r.machineNo) || 'no type') + '</span>' : '<span class="pill u">machine number needed</span>'}</div>
          <div class="sub">${fmtDate(r.date)} &nbsp;&middot;&nbsp; ${has(r.inR) ? dec(r.inR, 1) : '—'} &rarr; ${has(r.outR) ? dec(r.outR, 1) : '—'}${r.diesel ? ' &nbsp;&middot;&nbsp; ' + dec(r.diesel) + ' L' : ''}${r.remark ? ' &nbsp;&middot;&nbsp; ' + esc(r.remark) : ''}${num(r.openDiesel) ? ' &nbsp;&middot;&nbsp; <b>opening ' + dec(r.openDiesel) + ' L</b>' : ''}</div>
        </div>
        <div class="amt">${dec(h)}<div class="tiny" style="font-weight:500">hr</div>${(h > 0 && num(r.diesel) > 0) ? `<div class="tiny" style="font-weight:700;color:var(--rent)">${dec(num(r.diesel) / h, 2)} L/hr</div>` : ''}</div>
      </div>`;
    }).join('') : '<div class="empty">No entries yet. Tap "+ Machine entry" above to start.<i>अजून एंट्री नाही</i></div>'}
    ${rows.length > shown.length ? `<div class="pad center"><button class="btn sec sm" data-act="mlMore">Ajun ${rows.length - shown.length} entries dakhva</button></div>` : ''}
  </div>
  ${(f && rows.length) ? `<div class="card"><div class="pad">
    <div class="tiny" style="margin-bottom:8px;line-height:1.7"><b>${esc(f === '__none' ? 'Machine no nasleli' : f)}</b> chya <b>${rows.length}</b> entries (${dec(rows.reduce((a, r) => a + hoursOf(r), 0))} hours, ${dec(rows.reduce((a, r) => a + num(r.diesel), 0))} L diesel) ekach velela delete karta yetat.</div>
    <button class="btn dgr sm" style="width:100%" data-act="mlDelAll" data-v="${esc(f)}">Delete all entries of this machine<i>सगळ्या एन्ट्री डिलीट</i></button>
    <div class="tiny" style="margin-top:8px">Machine Master madhli machine rahil, fakt entries jatil.</div>
  </div></div>` : ''}`;
}

function machineSumView(s) {
  const rows = s.machines.map(m => ({ m, r: machineRent(s, m.no) }));
  const types = [...new Set(s.machines.map(m => m.type).filter(Boolean))];
  const tot = {
    e: s.machineLog.length,
    h: s.machineLog.reduce((a, r) => a + hoursOf(r), 0),
    d: s.machineLog.reduce((a, r) => a + num(r.diesel), 0)
  };
  const unassigned = s.machineLog.filter(r => !r.machineNo);
  return `
  <div class="kpis">
    <div class="kpi"><div class="k">MACHINES<i>मशीन</i></div><div class="v num">${s.machines.length}</div></div>
    <div class="kpi"><div class="k">LOG ENTRIES<i>एंट्री</i></div><div class="v num">${tot.e}</div></div>
    <div class="kpi b"><div class="k">TOTAL HOURS<i>एकूण तास</i></div><div class="v num">${dec(tot.h)}</div></div>
    <div class="kpi"><div class="k">DIESEL (L)<i>डिझेल लिटर</i></div><div class="v num">${dec(tot.d)}</div></div>
    <div class="kpi b"><div class="k">DIESEL / HOUR<i>तासाला डिझेल</i></div><div class="v num">${tot.h ? dec(tot.d / tot.h, 2) : '—'}</div></div>
  </div>
  ${unassigned.length ? `<div class="warn">${unassigned.length} entries have no machine number — their ${dec(unassigned.reduce((a, r) => a + hoursOf(r), 0))} hours are not counted in any machine rent. Fix them under <b>Daily log &rarr; No machine</b>.</div>` : ''}
  <div class="card"><h3>Type-wise<i>प्रकार नुसार</i></h3><div class="scroll"><table>
    <thead><tr><th>Type</th><th class="n">Count</th><th class="n">Hours</th><th class="n">Diesel</th><th class="n">L / hr</th><th class="n">Rent</th></tr></thead>
    <tbody>${types.map(t => {
      const list = rows.filter(x => x.m.type === t);
      const th = list.reduce((a, x) => a + x.r.hours, 0), tdz = list.reduce((a, x) => a + x.r.diesel, 0);
      return `<tr><td>${esc(t)}</td><td class="n">${list.length}</td><td class="n">${dec(th)}</td><td class="n">${dec(tdz)}</td><td class="n"><b style="color:var(--rent)">${th ? dec(tdz / th, 2) : '—'}</b></td><td class="n">${money0(list.reduce((a, x) => a + x.r.rent, 0))}</td></tr>`;
    }).join('')}</tbody></table></div></div>
  <div class="card"><h3>Machine-wise<i>मशीन नुसार</i></h3><div class="scroll"><table>
    <thead><tr><th>Machine</th><th class="n">Hours</th><th class="n">Diesel (L)</th><th class="n">L / hr</th><th class="n">Rent</th></tr></thead>
    <tbody>${rows.filter(x => x.r.entries).sort((a, b) => b.r.hours - a.r.hours).map(x => `<tr><td class="nowrap"><b>${esc(x.m.no)}</b><div class="tiny">${esc(x.m.type)}${x.m.owner ? ' \u00b7 ' + esc(x.m.owner) : ''}</div></td><td class="n">${dec(x.r.hours)}<div class="tiny">${x.r.entries} entries</div></td><td class="n">${dec(x.r.diesel)}</td><td class="n"><b style="color:var(--rent)">${x.r.hours ? dec(x.r.diesel / x.r.hours, 2) : '—'}</b></td><td class="n">${money0(x.r.rent)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No log entries.</td></tr>'}</tbody>
  </table></div></div>`;
}

function machineRentView(s) {
  const no = UI.rentMachine || (s.machines[0] && s.machines[0].no) || '';
  const from = UI.rentFrom || '', to = UI.rentTo || '';
  const m = machineOf(s, no); const r = no ? machineRent(s, no, from, to) : null;
  const logs = no ? s.machineLog.filter(x => x.machineNo === no && inRange(x.date, from, to)).sort(byDateDesc) : [];
  return `
  <div class="card"><h3>Select machine and period<i>मशीन आणि कालावधी निवडा</i></h3><div class="pad">
    <div class="field"><label>Machine no<i>मशीन नंबर</i></label><select data-act="rentMachine">${s.machines.map(x => `<option ${x.no === no ? 'selected' : ''}>${esc(x.no)}</option>`).join('')}</select></div>
    <div class="f2">
      <div class="field"><label>From date<i>पासून तारीख</i></label><input type="date" value="${from}" data-act="rentFrom"></div>
      <div class="field"><label>To date<i>पर्यंत तारीख</i></label><input type="date" value="${to}" data-act="rentTo"></div>
    </div>
    <div class="tiny">Leave the dates empty to see everything from the beginning until today.<i>तारीख रिकामी ठेवली तर पूर्ण हिशोब दिसेल</i></div>
  </div></div>
  ${!m ? '<div class="empty">Add machines in Machine Master.</div>' : `
  <div class="hero">
    <div class="lbl">RENT PAYABLE &mdash; ${esc(no)}</div>
    <div class="big"><small>&#8377;</small>${money0(r.rent)}</div>
    <div class="hsplit">
      <div><div class="k">${r.basis === 'Daily' ? 'DAYS' : 'HOURS'}</div><div class="v num">${dec(r.qty)}</div></div>
      <div><div class="k">RATE / ${r.basis === 'Daily' ? 'DAY' : 'HR'}</div><div class="v num">${dec(r.unit, 0)}</div></div>
      <div><div class="k">DIESEL (L)<i>डिझेल लिटर</i></div><div class="v num">${dec(r.diesel)}</div></div>
    </div>
  </div>
  <div class="card"><div class="pad"><button class="btn sec sm" style="width:100%" data-act="mBill" data-v="${esc(UI.rentMachine || '')}">Machine report PDF<i>मशीन रिपोर्ट</i></button></div></div>
  <div class="card"><h3>Machine details<i>मशीन माहिती</i></h3><div class="scroll"><table><tbody>
    <tr><td class="muted">Type</td><td class="right"><b>${esc(m.type || '—')}</b></td></tr>
    <tr><td class="muted">Owner</td><td class="right"><b>${esc(m.owner || '—')}</b></td></tr>
    <tr><td class="muted">Operator</td><td class="right"><b>${esc(m.operator || '—')}</b></td></tr>
    <tr><td class="muted">Make</td><td class="right"><b>${esc(m.make || '—')}</b></td></tr>
    <tr><td class="muted">Rate Basis</td><td class="right"><b>${esc(r.basis || '—')}</b></td></tr>
    <tr><td class="muted">Package Rate</td><td class="right n"><b>${money0(r.rate)}</b> / ${r.units} ${r.basis === 'Daily' ? 'days' : 'hr'}</td></tr>
    <tr><td class="muted">Entries in period</td><td class="right n"><b>${r.entries}</b></td></tr>
  </tbody></table></div></div>
  <div class="card"><h3>Entries<i>एंट्री</i> for this machine<i>या मशीनच्या एंट्री</i><small>${logs.length}</small></h3>
    ${logs.slice(0, 40).map(x => `<div class="row"><div class="main"><div class="ttl">${fmtDate(x.date)}</div><div class="sub">${has(x.inR) ? dec(x.inR, 1) : '—'} &rarr; ${has(x.outR) ? dec(x.outR, 1) : '—'}${x.diesel ? ' &middot; ' + dec(x.diesel) + ' L' : ''}</div></div><div class="amt">${dec(hoursOf(x))}<div class="tiny" style="font-weight:500">hr</div></div></div>`).join('') || '<div class="empty">No entries in this period.</div>'}
  </div>`}`;
}

function machineMasterView(s) {
  return `
  <div class="btnrow" style="margin:0 0 12px">
    <button class="btn" style="flex:1" data-act="mAdd">+ Add machine<i>मशीन जोडा</i></button>
    <button class="btn sec" style="flex:1" data-act="mArrange">Arrange order<i>क्रम बदला</i></button>
  </div>
  ${(() => {
    const g = machineGroups(s);
    if (!g.length) return '';
    return `<div class="card mt" style="border-color:var(--hivis)"><h3>Same machine, different names<i>एकच मशीन, वेगळे नाव</i><small>${g.length} group</small></h3>
      <div class="pad" style="padding-bottom:6px"><div class="tiny" style="line-height:1.7">Khalche naav ekach machine che disat aahet (udaharan <b>PC.o5</b> ani <b>PC.05</b>). "Ek kara" dabla ki saglya entries ekach naavavar jatil.</div></div>
      ${g.slice(0, 12).map(o => `<div class="row" style="display:block">
        <div class="ttl">${esc(o.target)} <span class="tiny">&larr; ${o.items.length} naav, ${o.total} entries</span></div>
        <div class="sub">${o.items.map(x => esc(x.no) + ' (' + x.n + ')').join('  ·  ')}</div>
        <div class="btnrow" style="margin-top:8px">
          <button class="btn sm" style="flex:1" data-act="mgMerge" data-v="${esc(o.key)}">Merge into ${esc(o.target)}<i>एक करा</i></button>
          <button class="btn sec sm" style="flex:0 0 32%" data-act="mgEdit" data-v="${esc(o.key)}">Rename</button>
        </div>
      </div>`).join('')}
      ${g.length > 12 ? `<div class="pad tiny">ani ${g.length - 12} ajun...</div>` : ''}
      <div class="pad"><button class="btn dk sm" style="width:100%" data-act="mgAll">Merge all ${g.length} groups<i>सगळे एक करा</i></button>
      <div class="tiny" style="margin-top:8px">Badalnyaadhi juna data snapshot madhe jato &mdash; chukla tar Data safety madhun parat aanta yeto.</div></div>
    </div>`;
  })()}
  <div class="card mt"><h3>Rate master<i>रेट मास्टर</i><small>fill rates here</small></h3><div class="scroll"><table>
    <thead><tr><th>Type</th><th>Basis</th><th class="n">Package Rate</th><th class="n">Units</th><th class="n">Per Hr/Day</th></tr></thead>
    <tbody>${s.rateMaster.map((r, i) => `<tr data-act="rmEdit" data-v="${i}"><td><b>${esc(r.type)}</b></td><td class="tiny">${esc(r.basis)}</td><td class="n">${r.packageRate ? money0(r.packageRate) : '<span class="pill u">to fill</span>'}</td><td class="n">${r.packageUnits}</td><td class="n">${r.packageRate ? dec(num(r.packageRate) / (num(r.packageUnits) || 1), 0) : '—'}</td></tr>`).join('')}</tbody>
  </table></div><div class="pad tiny">Tap a row to change the rate. For a machine-specific rate, open that machine in the list below.<i>रेट बदलण्यासाठी ओळीवर टॅप करा</i></div></div>
  <div class="card"><h3>Machines<i>मशीन</i><small>${s.machines.length}</small></h3>
    ${s.machines.map(m => `<div class="row" data-act="mEdit" data-v="${m.id}">
      <div class="main"><div class="ttl">${esc(m.no)} <span class="pill n">${esc(m.type)}</span></div>
      <div class="sub">${esc(m.owner || 'no owner')}${m.operator ? ' &middot; ' + esc(m.operator) : ''}${(() => { const q = machineRent(s, m.no); return q.hours ? ' &middot; <b>' + dec(q.diesel / q.hours, 2) + ' L/hr</b>' : ''; })()}</div></div>
      <div class="amt tiny" style="font-weight:600">${has(m.monthlyRate) && num(m.monthlyRate) ? money0(m.monthlyRate) : ''}</div>
      <button class="rowbtn" data-act="mRename" data-v="${m.id}">Rename</button>
      <button class="rowbtn" data-act="mBill" data-v="${esc(m.no)}" style="color:var(--hivis-dk)">PDF</button>
      <button class="rowbtn" data-act="mDelOne" data-v="${m.id}" style="color:var(--due)">Delete</button>
    </div>`).join('') || '<div class="empty">No machines yet.<i>अजून मशीन नाही</i></div>'}
  </div>`;
}

/* ---------------- DIESEL ---------------- */
VIEW.diesel = s => sub('diesel') === 'log' ? dieselLogView(s) : dieselSumView(s);

function dieselLogView(s) {
  const fin = settle(s);
  const rows = s.dieselLog.slice().sort(byDateDesc);
  const shown = rows.slice(0, UI.dlMore || 50);
  const t = totals(s);
  return `
  <button class="btn" data-act="dAdd">+ Diesel entry<i>डिझेल एंट्री</i></button>
  <div class="kpis k3 mt">
    <div class="kpi"><div class="k">TOTAL DIESEL<i>एकूण डिझेल</i></div><div class="v num">${dec(t.dsLitres)} L</div></div>
    <div class="kpi g"><div class="k">PAID<i>दिले</i></div><div class="v num">${money0(t.dsPaidFinal)}</div></div>
    <div class="kpi r"><div class="k">BAKI<i>बाकी</i></div><div class="v num">${money0(t.dsUnpaidFinal)}</div></div>
  </div>
  <div class="card">${shown.length ? shown.map(d => `<div class="row" data-act="dEdit" data-v="${d.id}">
      <div class="main"><div class="ttl">${esc(d.vendor)} <span class="pill ${fin[d.id] && fin[d.id].final === 'Paid' ? 'p' : 'u'}">${fin[d.id] && fin[d.id].final === 'Paid' ? (st(d) === 'Paid' ? 'Paid' : 'Paid (payment)') : 'Unpaid'}</span></div>
      <div class="sub">${fmtDate(d.date)} &middot; ${dec(d.litres)} L${num(d.litres) ? ' @ ' + dec(num(d.amount) / num(d.litres), 2) : ''}${d.paidBy ? ' &middot; ' + esc(d.paidBy) : ''}${d.bill && d.bill !== '-' ? ' &middot; Bill ' + esc(d.bill) : ''}</div></div>
      <div class="amt">${money0(d.amount)}${(fin[d.id] && fin[d.id].final === 'Unpaid' && fin[d.id].paid > 0.5) ? `<div class="tiny" style="font-weight:700;color:var(--paid)">- ${money0(fin[d.id].paid)} dile</div>` : ''}</div></div>`).join('') : '<div class="empty">No diesel entries yet.<i>अजून डिझेल एंट्री नाही</i></div>'}
    ${rows.length > shown.length ? `<div class="pad center"><button class="btn sec sm" data-act="dlMore">Ajun ${rows.length - shown.length} dakhva</button></div>` : ''}
  </div>`;
}

function dieselSumView(s) {
  const t = totals(s);
  const avg = t.dsLitres ? t.dsTotal / t.dsLitres : 0;
  return `
  <div class="kpis">
    <div class="kpi"><div class="k">TOTAL LITRES<i>एकूण लिटर</i></div><div class="v num">${dec(t.dsLitres)}</div></div>
    <div class="kpi"><div class="k">TOTAL AMOUNT<i>एकूण रक्कम</i></div><div class="v num">${money0(t.dsTotal)}</div></div>
    <div class="kpi"><div class="k">AVG RATE / L<i>सरासरी रेट</i></div><div class="v num">${dec(avg, 2)}</div></div>
    <div class="kpi r"><div class="k">UNPAID<i>बाकी</i></div><div class="v num">${money0(t.dsUnpaid)}</div></div>
  </div>
  <div class="card"><h3>Vendor-wise<i>व्हेंडर नुसार</i></h3><div class="scroll"><table>
    <thead><tr><th>Vendor</th><th class="n">Litres</th><th class="n">Amount</th><th class="n">Direct paid</th><th class="n">Payments</th><th class="n">Baki</th></tr></thead>
    <tbody>${s.dieselVendors.map(v => { const x = dieselVendorStats(s, v); return `<tr data-act="vBill" data-v="${esc(v)}"><td class="nowrap">${esc(v)}<div class="tiny" style="color:var(--hivis-dk)">PDF</div></td><td class="n">${dec(x.litres)}</td><td class="n">${money0(x.amount)}</td><td class="n">${money0(x.direct)}</td><td class="n">${money0(x.payments)}</td><td class="n"><b style="color:${x.remaining > 0.5 ? 'var(--due)' : 'var(--paid)'}">${money0(x.remaining)}</b></td></tr>`; }).join('') || '<tr><td colspan="6" class="muted">Add a diesel vendor.</td></tr>'}</tbody>
  </table></div></div>
  <div class="card"><h3>Machine-wise<i>मशीन नुसार</i> diesel</h3><div class="scroll"><table>
    <thead><tr><th>Machine</th><th class="n">Diesel (L)</th><th class="n">Hours</th><th class="n">L / hr</th></tr></thead>
    <tbody>${s.machines.map(m => ({ m, r: machineRent(s, m.no) })).filter(x => x.r.diesel > 0).sort((a, b) => b.r.diesel - a.r.diesel).map(x => `<tr><td class="nowrap"><b>${esc(x.m.no)}</b></td><td class="n">${dec(x.r.diesel)}</td><td class="n">${dec(x.r.hours)}</td><td class="n">${x.r.hours ? dec(x.r.diesel / x.r.hours, 2) : '—'}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Appears once diesel is filled in the machine log.</td></tr>'}</tbody>
  </table></div></div>`;
}

/* ---------------- EXPENSE ---------------- */
VIEW.expense = s => sub('expense') === 'log' ? expenseLogView(s) : expenseSumView(s);

function expenseLogView(s) {
  const fin = settle(s);
  const f = UI.exCat || '';
  let rows = s.expenseLog.slice().sort(byDateDesc);
  if (f === '__unpaid') rows = rows.filter(e => fin[e.id].final === 'Unpaid');
  else if (f) rows = rows.filter(e => e.category === f);
  const shown = rows.slice(0, UI.exMore || 50);
  const sum = rows.reduce((a, e) => a + num(e.amount), 0);
  const t = totals(s);
  const tm = s.expenseLog.filter(e => monthKey(e.date) === monthKey(today())).reduce((a, e) => a + num(e.amount), 0);
  return `
  <button class="btn" data-act="eAdd">+ New expense<i>नवीन खर्च</i></button>
  <div class="kpis k3 mt">
    <div class="kpi"><div class="k">TOTAL<i>एकूण</i></div><div class="v num">${money0(t.expTotal)}</div></div>
    <div class="kpi"><div class="k">THIS MONTH<i>या महिन्यात</i></div><div class="v num">${money0(tm)}</div></div>
    <div class="kpi r"><div class="k">PENDING<i>बाकी</i></div><div class="v num">${money0(t.expUnpaidFinal)}</div></div>
  </div>
  <div class="card">
    <div class="chips">
      <button class="chip ${!f ? 'on' : ''}" data-act="exCat" data-v="">All</button>
      <button class="chip ${f === '__unpaid' ? 'on' : ''}" data-act="exCat" data-v="__unpaid">Unpaid</button>
      ${s.categories.map(c => `<button class="chip ${f === c ? 'on' : ''}" data-act="exCat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}
    </div>
    ${f ? `<div class="pad tiny" style="border-bottom:1px solid var(--line-2)">${rows.length} entries &middot; total <b class="num">${money(sum)}</b></div>` : ''}
    ${shown.length ? shown.map(e => {
      const fs = fin[e.id];
      return `<div class="row" data-act="eEdit" data-v="${e.id}">
        <div class="main"><div class="ttl">${esc(e.desc || e.category)} <span class="pill ${fs.final === 'Paid' ? 'p' : 'u'}">${fs.final}</span></div>
        <div class="sub">${fmtDate(e.date)} &middot; ${esc(e.category)}${e.vendor ? ' &middot; ' + esc(e.vendor) : ''}${fs.by ? ' &middot; ' + esc(fs.by) : ''}</div></div>
        <div class="amt">${money0(e.amount)}${(fs.final === 'Unpaid' && fs.paid > 0.5) ? `<div class="tiny" style="font-weight:700;color:var(--paid)">- ${money0(fs.paid)} dile</div><div class="tiny" style="font-weight:700;color:var(--due)">baki ${money0(fs.bal)}</div>` : ''}</div></div>`;
    }).join('') : '<div class="empty">Nothing here.<i>इथे काही नाही</i></div>'}
    ${rows.length > shown.length ? `<div class="pad center"><button class="btn sec sm" data-act="exMore">Ajun ${rows.length - shown.length} dakhva</button></div>` : ''}
  </div>`;
}

function expenseSumView(s) {
  const t = totals(s), fin = t.fin;
  const cats = s.categories.map(c => ({ c, x: categoryStats(s, c, fin) })).filter(o => o.x.entries).sort((a, b) => b.x.total - a.x.total);
  const max = Math.max(1, ...cats.map(o => o.x.total));
  const months = monthSeries(s, fin).filter(m => m.total || m.diesel);
  const tday = s.expenseLog.filter(e => e.date === today()).reduce((a, e) => a + num(e.amount), 0);
  return `
  <div class="kpis">
    <div class="kpi"><div class="k">TOTAL<i>एकूण</i></div><div class="v num">${money0(t.expTotal)}</div></div>
    <div class="kpi g"><div class="k">PAID<i>दिले</i></div><div class="v num">${money0(t.expPaidFinal)}</div></div>
    <div class="kpi r"><div class="k">PENDING<i>बाकी</i></div><div class="v num">${money0(t.expUnpaidFinal)}</div></div>
    <div class="kpi"><div class="k">TODAY'S EXPENSE<i>आजचा खर्च</i></div><div class="v num">${money0(tday)}</div></div>
  </div>
  <div class="card"><h3>Category-wise<i>प्रकार नुसार</i></h3>
    ${cats.map(o => `<div class="row" style="display:block">
      <div style="display:flex;justify-content:space-between;gap:8px"><div class="ttl">${esc(o.c)}</div><div class="amt">${money0(o.x.total)}</div></div>
      <div class="bar"><i style="width:${(o.x.total / max * 100).toFixed(1)}%"></i></div>
      <div class="sub">${o.x.entries} entries &middot; paid ${money0(o.x.paid)}${o.x.unpaid ? ' &middot; <b style="color:var(--due)">pending ' + money0(o.x.unpaid) + '</b>' : ''} &middot; ${(o.x.total / (t.expTotal || 1) * 100).toFixed(1)}%</div>
    </div>`).join('') || '<div class="empty">Summary appears once expenses are added.</div>'}
  </div>
  <div class="card"><h3>Month-wise<i>महिना नुसार</i></h3><div class="scroll"><table>
    <thead><tr><th>Month</th><th class="n">Site</th><th class="n">Diesel</th><th class="n">Paid</th><th class="n">Pending</th></tr></thead>
    <tbody>${months.map(m => `<tr><td class="nowrap">${monthName(m.k)}</td><td class="n">${money0(m.total)}</td><td class="n">${money0(m.diesel)}</td><td class="n">${money0(m.paid)}</td><td class="n" style="color:${m.unpaid ? 'var(--due)' : 'inherit'}">${money0(m.unpaid)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No data.</td></tr>'}</tbody>
  </table></div></div>`;
}

/* ---------------- VENDOR ---------------- */
VIEW.vendor = s => { const k = sub('vendor'); return k === 'due' ? dueView(s) : k === 'pend' ? vendorPendView(s) : k === 'pay' ? vendorPayView(s) : vendorSumView(s); };

function vendorPendView(s) {
  const fin = settle(s);
  const pend = s.expenseLog.filter(e => fin[e.id].final === 'Unpaid').sort(byDateDesc);
  const byV = {}; pend.forEach(e => { const v = e.vendor || '(no vendor)'; (byV[v] = byV[v] || []).push(e); });
  const dieselPend = s.dieselLog.filter(d => fin[d.id] && fin[d.id].final === 'Unpaid');
  const total = pend.reduce((a, e) => a + num(e.amount), 0);
  return `
  <div class="kpis">
    <div class="kpi r"><div class="k">SITE PENDING<i>साइट बाकी</i></div><div class="v num">${money0(total)}</div></div>
    <div class="kpi r"><div class="k">DIESEL PENDING<i>डिझेल बाकी</i></div><div class="v num">${money0(dieselPend.reduce((a, d) => a + num(d.amount), 0))}</div></div>
  </div>
  ${Object.keys(byV).sort().map(v => {
    const list = byV[v]; const vs = v === '(no vendor)' ? null : vendorStats(s, v);
    return `<div class="card"><h3>${esc(v)}<small>balance ${money(list.reduce((a, e) => a + num(e.amount), 0))}</small></h3>
      ${list.map(e => `<div class="row" data-act="eEdit" data-v="${e.id}"><div class="main"><div class="ttl">${esc(e.desc || e.category)}</div><div class="sub">${fmtDate(e.date)} &middot; ${esc(e.category)}</div></div>
        <div class="amt">${money0(e.amount)}${(fin[e.id] && fin[e.id].paid > 0.5) ? `<div class="tiny" style="font-weight:700;color:var(--paid)">- ${money0(fin[e.id].paid)}</div><div class="tiny" style="font-weight:700;color:var(--due)">baki ${money0(fin[e.id].bal)}</div>` : ''}</div></div>`).join('')}
      ${vs ? `<div class="pad"><button class="btn sm" data-act="vpAdd" data-v="${esc(v)}">Make payment<i>पेमेंट करा</i></button></div>` : ''}
    </div>`;
  }).join('') || '<div class="card"><div class="empty">No pending vendor credit.<i>कोणाची उधारी बाकी नाही</i></div></div>'}
  ${(() => {
    const dv = (s.dieselVendors || []).map(v => ({ v, x: dieselVendorStats(s, v) })).filter(o => o.x.remaining > 0.5);
    if (!dv.length) return '';
    return dv.map(o => {
      const bills = s.dieselLog.filter(d => d.vendor === o.v && fin[d.id] && fin[d.id].final === 'Unpaid').sort(byDateDesc);
      return `<div class="card"><h3>${esc(o.v)}<i>डिझेल</i><small>baki ${money(o.x.remaining)}</small></h3>
        <div class="scroll"><table><tbody>
          <tr><td class="muted">Ekun bill</td><td class="right n"><b>${money(o.x.amount)}</b></td></tr>
          <tr><td class="muted">Direct dile</td><td class="right n">${money(o.x.direct)}</td></tr>
          <tr><td class="muted">Payment kele</td><td class="right n">${money(o.x.payments)}</td></tr>
          <tr><td class="muted"><b>BAKI</b></td><td class="right n"><b style="color:var(--due)">${money(o.x.remaining)}</b></td></tr>
        </tbody></table></div>
        ${bills.slice(0, 12).map(d => `<div class="row" data-act="dEdit" data-v="${d.id}"><div class="main"><div class="ttl">${fmtDate(d.date)}</div>
          <div class="sub">${dec(d.litres)} L${d.bill ? ' &middot; bill ' + esc(d.bill) : ''}</div></div><div class="amt">${money0(d.amount)}</div></div>`).join('')}
        <div class="pad"><button class="btn sm" style="width:100%" data-act="vpAdd" data-v="${esc(o.v)}">Make payment<i>पेमेंट करा</i></button></div>
      </div>`;
    }).join('');
  })()}`;
}

function vendorPayView(s) {
  const rows = s.vendorPayments.slice().sort(byDateDesc);
  const due = allVendors(s).map(v => ({ v, x: remVendorStats(s, v), d: isDieselVendor(s, v) }))
    .filter(o => o.x.remaining > 0.5).sort((a, b) => b.x.remaining - a.x.remaining);
  return `
  <button class="btn" data-act="vpAdd">+ Vendor payment<i>व्हेंडर पेमेंट</i></button>
  ${due.length ? `<div class="card mt"><h3>Who to pay<i>कोणाला किती द्यायचे</i><small>${money(due.reduce((a, o) => a + o.x.remaining, 0))}</small></h3>
    ${due.map(o => `<div class="row">
      <div class="main"><div class="ttl">${esc(o.v)} ${o.d ? '<span class="pill n">diesel</span>' : ''}</div>
      <div class="sub">ekun ${money(o.x.total || o.x.amount)} &middot; dile ${money((o.x.direct || 0) + (o.x.paid || o.x.payments || 0))}</div></div>
      <div class="amt" style="color:var(--due)">${money0(o.x.remaining)}</div>
      <button class="rowbtn" data-act="vpAdd" data-v="${esc(o.v)}" style="color:var(--hivis-dk)">Payment</button></div>`).join('')}
    <div class="pad tiny">Payment takla ki tya vendor che junya bill pasun apoap Paid hotat &mdash; diesel bills pn.</div>
  </div>` : ''}
  <div class="kpis mt" style="grid-template-columns:1fr">
    <div class="kpi g"><div class="k">TOTAL PAID OUT<i>एकूण पेमेंट</i></div><div class="v num">${money0(rows.reduce((a, p) => a + num(p.amount), 0))}</div></div>
  </div>
  <div class="card">${rows.map(p => `<div class="row" data-act="vpEdit" data-v="${p.id}">
    <div class="main"><div class="ttl">${esc(p.vendor)}</div><div class="sub">${fmtDate(p.date)}${p.paidBy ? ' &middot; ' + esc(p.paidBy) : ''}${p.mode ? ' &middot; ' + esc(p.mode) : ''}${p.remark ? ' &middot; ' + esc(p.remark) : ''}</div></div>
    <div class="amt">${money0(p.amount)}</div></div>`).join('') || '<div class="empty">No payments yet.<i>अजून पेमेंट नाही</i></div>'}</div>`;
}

function vendorSumView(s) {
  const rows = allVendors(s).map(v => ({ v, x: vendorStats(s, v) })).filter(o => o.x.total || o.x.paid);
  const T = rows.reduce((a, o) => ({ t: a.t + o.x.total, d: a.d + o.x.direct, p: a.p + o.x.paid, r: a.r + o.x.remaining }), { t: 0, d: 0, p: 0, r: 0 });
  return `
  <div class="card"><h3>Vendor-wise account<i>व्हेंडर नुसार हिशोब</i></h3><div class="scroll"><table>
    <thead><tr><th>Vendor</th><th class="n">Total</th><th class="n">Direct paid</th><th class="n">Payments</th><th class="n">Remaining</th></tr></thead>

VIEW.murum = s => {
  const t = totals(s);
  const rows = (s.murumLog || []).slice().sort(byDateDesc);
  const shown = rows.slice(0, UI.muMore || 50);
  const sups = [...new Set((s.murumLog || []).map(r => r.vendor).filter(Boolean))];
  const avg = t.muQty ? t.muTotal / t.muQty : 0;
  return `
  <button class="btn" data-act="muAdd">+ Murum entry<i>मुरुम एंट्री</i></button>
  <div class="kpis mt">
    <div class="kpi"><div class="k">TOTAL ${esc((s.murumUnit || 'Brass').toUpperCase())}</div><div class="v num">${dec(t.muQty)}</div></div>
    <div class="kpi"><div class="k">TOTAL AMOUNT<i>एकूण रक्कम</i></div><div class="v num">${money0(t.muTotal)}</div></div>
    <div class="kpi"><div class="k">AVG RATE<i>सरासरी रेट</i></div><div class="v num">${dec(avg, 0)}</div></div>
    <div class="kpi r"><div class="k">PENDING<i>बाकी</i></div><div class="v num">${money0(t.muUnpaid)}</div></div>
  </div>
  <div class="card">${shown.length ? shown.map(r => `<div class="row" data-act="muEdit" data-v="${r.id}">
      <div class="main"><div class="ttl">${esc(r.vendor || 'no supplier')} <span class="pill ${st(r) === 'Paid' ? 'p' : 'u'}">${st(r)}</span></div>
      <div class="sub">${fmtDate(r.date)} &middot; ${dec(r.qty)} ${esc(s.murumUnit || 'Brass')}${num(r.rate) ? ' @ ' + dec(r.rate, 0) : ''}${r.trips ? ' &middot; ' + dec(r.trips) + ' trip' : ''}${r.paidBy ? ' &middot; ' + esc(r.paidBy) : ''}${r.remark ? ' &middot; ' + esc(r.remark) : ''}</div></div>
      <div class="amt">${money0(mAmt(r))}</div></div>`).join('') : '<div class="empty">No murum entries yet.<i>अजून मुरुम एंट्री नाही</i></div>'}
    ${rows.length > shown.length ? `<div class="pad center"><button class="btn sec sm" data-act="muMore">Ajun ${rows.length - shown.length} dakhva</button></div>` : ''}
  </div>
  ${sups.length ? `<div class="card"><h3>Supplier-wise<i>सप्लायर नुसार</i></h3><div class="scroll"><table>
    <thead><tr><th>Supplier</th><th class="n">${esc(s.murumUnit || 'Brass')}</th><th class="n">Trips</th><th class="n">Amount</th><th class="n">Balance</th></tr></thead>
    <tbody>${sups.map(v => {
      const list = s.murumLog.filter(r => r.vendor === v);
      const amt = list.reduce((a, r) => a + mAmt(r), 0);
      const unp = list.filter(r => st(r) === 'Unpaid').reduce((a, r) => a + mAmt(r), 0);
      return `<tr><td class="nowrap">${esc(v)}</td><td class="n">${dec(list.reduce((a, r) => a + num(r.qty), 0))}</td><td class="n">${dec(list.reduce((a, r) => a + num(r.trips), 0))}</td><td class="n">${money0(amt)}</td><td class="n" style="color:${unp ? 'var(--due)' : 'inherit'}">${money0(unp)}</td></tr>`;
    }).join('')}</tbody></table></div></div>` : ''}`;
};

/* ---------- zip (store, no compression) ---------- */
const CRC_T = (() => { const t = new Int32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c; } return t; })();
function crc32(b) { let c = -1; for (let i = 0; i < b.length; i++) c = (c >>> 8) ^ CRC_T[(c ^ b[i]) & 0xFF]; return (c ^ -1) >>> 0; }
const ENC = new TextEncoder();

function zipStore(files) {
  const parts = [], central = [];
  let off = 0;
  files.forEach(f => {
    const name = ENC.encode(f.name), data = f.data, crc = crc32(data);
    const lh = new Uint8Array(30 + name.length), dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0x2821, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true);
    dv.setUint16(26, name.length, true); dv.setUint16(28, 0, true);
    lh.set(name, 30);
    parts.push(lh, data);
    const ch = new Uint8Array(46 + name.length), cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0x2821, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
    cv.setUint16(28, name.length, true); cv.setUint32(42, off, true);
    ch.set(name, 46);
    central.push(ch);
    off += lh.length + data.length;
  });
  const cdSize = central.reduce((a, c) => a + c.length, 0);
  const end = new Uint8Array(22), ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, off, true);
  const all = parts.concat(central, [end]);
  const total = all.reduce((a, p) => a + p.length, 0);
  const out = new Uint8Array(total);
  let p = 0; all.forEach(x => { out.set(x, p); p += x.length; });
  return out;
}

/* ---------- xml helpers ---------- */
const X = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function colL(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; }
function serial(d) { const p = String(d).split('-'); if (p.length !== 3) return null; return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000) + 25569; }

/* cell builders */
const SY = { title: 1, head: 2, col: 3, txt: 4, date: 5, money: 6, dec1: 7, dec2: 8, bold: 9, tot: 10, kpiL: 11, kpiV: 12, int: 13, note: 14, sub: 15 };
const T = (v, s) => ({ t: 's', v, s: s == null ? SY.txt : s });
const N_ = (v, s) => ({ t: 'n', v, s: s == null ? SY.money : s });
const D_ = (v, s) => { const x = serial(v); return x == null ? T(v, s == null ? SY.date : s) : { t: 'n', v: x, s: s == null ? SY.date : s }; };
const F_ = (f, s) => ({ t: 'f', f, s: s == null ? SY.money : s });
const E_ = null;

function sheetXml(sh) {
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  x += '<sheetViews><sheetView workbookViewId="0" showGridLines="0"';
  x += (sh.tabSelected ? ' tabSelected="1"' : '') + '>';
  if (sh.freeze) x += `<pane ySplit="${sh.freeze}" topLeftCell="A${sh.freeze + 1}" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft"/>`;
  x += '</sheetView></sheetViews><sheetFormatPr defaultRowHeight="16"/>';
  if (sh.cols && sh.cols.length) {
    x += '<cols>' + sh.cols.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('') + '</cols>';
  }
  x += '<sheetData>';
  sh.rows.forEach((row, ri) => {
    if (!row) return;
    const r = ri + 1;
    const cells = row.map((c, ci) => {
      if (c == null) return '';
      const ref = colL(ci + 1) + r;
      const s = c.s ? ` s="${c.s}"` : '';
      if (c.t === 'f') return `<c r="${ref}"${s}><f>${X(c.f)}</f></c>`;
      if (c.t === 'n') return `<c r="${ref}"${s}><v>${c.v}</v></c>`;
      if (c.v === '' || c.v == null) return `<c r="${ref}"${s}/>`;
      return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${X(c.v)}</t></is></c>`;
    }).join('');
    if (!cells) return;
    const ht = sh.heights && sh.heights[r] ? ` ht="${sh.heights[r]}" customHeight="1"` : '';
    x += `<row r="${r}"${ht}>${cells}</row>`;
  });
  x += '</sheetData>';
  if (sh.merges && sh.merges.length) x += `<mergeCells count="${sh.merges.length}">` + sh.merges.map(m => `<mergeCell ref="${m}"/>`).join('') + '</mergeCells>';
  if (sh.dv && sh.dv.length) x += `<dataValidations count="${sh.dv.length}">` + sh.dv.map(d => `<dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1" sqref="${d.sq}"><formula1>${X(d.f)}</formula1></dataValidation>`).join('') + '</dataValidations>';
  x += '<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/></worksheet>';
  return x;
}

const SUMR = (col, a, b) => b >= a ? `SUM($${col}$${a}:$${col}$${b})` : '0';

/* ---------- workbook builder ---------- */
function buildWorkbook(s) {
  const m = s.mods || {};
  const SPARE = 200;
  const ml = s.machineLog, dl = s.dieselLog, el = s.expenseLog, vp = s.vendorPayments;
  const mu = s.murumLog || [], fn = s.funds || [], op = s.ownerPayments || [];
  const R = n => n + 2 + SPARE;                       // shevatchi row (header row 2, data row 3 pasun)
  const mlL = R(ml.length), dlL = R(dl.length), elL = R(el.length), vpL = R(vp.length);
  const muL = R(mu.length), fnL = R(fn.length), opL = R(op.length);
  const mmL = s.machines.length + 2 + 50, rmL = s.rateMaster.length + 2 + 10;
  const mstL = Math.max(s.categories.length, s.vendors.length, s.dieselVendors.length, s.people.length) + 2 + 30;
  const mrL = s.machines.length + 2;
  const Q = "'";
  const SH = {};                                       // sheet name -> included

  const titleRow = (txt, span) => ({ row: [T(txt, SY.title)], merge: 'A1:' + colL(span) + '1' });
  const sheets = [];

  /* ---------- log sheet factory ---------- */
  function logSheet(name, cols, widths, data, rowFn, extra) {
    const rows = [];
    rows[0] = [T(s.name + '  \u2014  ' + name, SY.title)];
    rows[1] = cols.map(c => T(c, SY.col));
    const n = data.length + SPARE;
    for (let i = 0; i < n; i++) {
      const r = i + 3;
      rows[r - 1] = rowFn(data[i], r, i);
    }
    return Object.assign({
      name, freeze: 2, cols: widths, rows,
      merges: ['A1:' + colL(cols.length) + '1'],
      heights: { 1: 26, 2: 28 }
    }, extra || {});
  }

  /* ---------- Machine Log ---------- */
  if (m.machine !== false) {
    sheets.push(logSheet('Machine Log',
      ['Sr No', 'Date', 'Machine No', 'Machine Type', 'In Reading', 'Out Reading', 'Total Hr', 'Diesel Filled (L)', 'Remark'],
      [7, 13, 13, 14, 12, 12, 10, 13, 26], ml,
      (r, n) => [
        F_(`IF($C${n}="","",COUNTA($C$3:$C${n}))`, SY.int),
        r ? D_(r.date) : E_,
        r ? T(r.machineNo) : T('', SY.txt),
        F_(`IF($C${n}="","",IFERROR(INDEX('Machine Master'!$C$3:$C$${mmL},MATCH($C${n},'Machine Master'!$B$3:$B$${mmL},0)),"Not Found"))`, SY.txt),
        r && has(r.inR) ? N_(num(r.inR), SY.dec1) : E_,
        r && has(r.outR) ? N_(num(r.outR), SY.dec1) : E_,
        F_(`IF(OR($E${n}="",$F${n}=""),"",$F${n}-$E${n})`, SY.dec1),
        r && has(r.diesel) ? N_(num(r.diesel), SY.dec1) : E_,
        r ? T(r.remark) : T('', SY.txt)
      ],
      { dv: [{ sq: `C3:C${mlL}`, f: `'Machine Master'!$B$3:$B$${mmL}` }] }));
  }

  /* ---------- Diesel ---------- */
  if (m.diesel !== false) {
    sheets.push(logSheet('Diesel Purchase',
      ['Sr No', 'Date', 'Diesel Vendor', 'Diesel (L)', 'Bill No', 'Amount (Rs)', 'Status', 'Paid By', 'Rate / L', 'Remark'],
      [7, 13, 20, 11, 11, 14, 10, 13, 10, 24], dl,
      (r, n) => [
        F_(`IF($B${n}="","",COUNTA($B$3:$B${n}))`, SY.int),
        r ? D_(r.date) : E_,
        r ? T(r.vendor) : T('', SY.txt),
        r && has(r.litres) ? N_(num(r.litres), SY.dec2) : E_,
        r ? T(r.bill) : T('', SY.txt),
        r && has(r.amount) ? N_(num(r.amount)) : E_,
        r ? T(st(r)) : T('', SY.txt),
        r ? T(r.paidBy) : T('', SY.txt),
        F_(`IF(OR($D${n}="",$F${n}=""),"",$F${n}/$D${n})`, SY.dec2),
        r ? T(r.remark) : T('', SY.txt)
      ],
      {
        dv: [{ sq: `C3:C${dlL}`, f: `Masters!$E$3:$E$${mstL}` },
        { sq: `G3:G${dlL}`, f: '"Paid,Unpaid"' },
        { sq: `H3:H${dlL}`, f: `Masters!$G$3:$G$${mstL}` }]
      }));
  }

  /* ---------- Murum ---------- */
  if (m.murum) {
    const u = s.murumUnit || 'Brass';
    sheets.push(logSheet('Murum Log',
      ['Sr No', 'Date', 'Supplier', u, 'Rate / ' + u, 'Amount (Rs)', 'Status', 'Paid By', 'Trips', 'Remark'],
      [7, 13, 20, 10, 12, 14, 10, 13, 8, 24], mu,
      (r, n) => [
        F_(`IF($B${n}="","",COUNTA($B$3:$B${n}))`, SY.int),
        r ? D_(r.date) : E_,
        r ? T(r.vendor) : T('', SY.txt),
        r && has(r.qty) ? N_(num(r.qty), SY.dec2) : E_,
        r && has(r.rate) ? N_(num(r.rate)) : E_,
        (r && num(r.amount) && !(num(r.qty) && num(r.rate)))
          ? N_(mAmt(r))
          : F_(`IF(OR($D${n}="",$E${n}=""),"",$D${n}*$E${n})`),
        r ? T(st(r)) : T('', SY.txt),
        r ? T(r.paidBy) : T('', SY.txt),
        r && has(r.trips) ? N_(num(r.trips), SY.int) : E_,
        r ? T(r.remark) : T('', SY.txt)
      ],
      {
        dv: [{ sq: `C3:C${muL}`, f: `Masters!$C$3:$C$${mstL}` },
        { sq: `G3:G${muL}`, f: '"Paid,Unpaid"' },
        { sq: `H3:H${muL}`, f: `Masters!$G$3:$G$${mstL}` }]
      }));
  }

  /* ---------- Expense Log ---------- */
  const vpRef = m.vendor !== false;
  sheets.push(logSheet('Expense Log',
    ['Sr No', 'Date', 'Category', 'Description', 'Vendor', 'Amount (Rs)', 'Status', 'Paid By', 'Remark', 'Final Status', 'Settled By'],
    [7, 13, 20, 30, 20, 14, 10, 13, 22, 12, 12], el,
    (r, n) => [
      F_(`IF($B${n}="","",COUNTA($B$3:$B${n}))`, SY.int),
      r ? D_(r.date) : E_,
      r ? T(r.category) : T('', SY.txt),
      r ? T(r.desc) : T('', SY.txt),
      r ? T(r.vendor) : T('', SY.txt),
      r && has(r.amount) ? N_(num(r.amount)) : E_,
      r ? T(st(r)) : T('', SY.txt),
      r ? T(r.paidBy) : T('', SY.txt),
      r ? T(r.remark) : T('', SY.txt),
      F_(`IF($B${n}="","",IF($G${n}="Paid","Paid",IF($E${n}="","Unpaid",IF(${vpRef ? `SUMIF('Vendor Payment'!$C$3:$C$${vpL},$E${n},'Vendor Payment'!$D$3:$D$${vpL})` : '0'}>=SUMIFS($F$3:$F${n},$E$3:$E${n},$E${n},$G$3:$G${n},"Unpaid"),"Paid","Unpaid"))))`, SY.txt),
      F_(`IF($J${n}="Paid",IF($G${n}="Paid",$H${n},"Vendor payment"),"")`, SY.txt)
    ],
    {
      dv: [{ sq: `C3:C${elL}`, f: `Masters!$A$3:$A$${mstL}` },
      { sq: `E3:E${elL}`, f: `Masters!$C$3:$C$${mstL}` },
      { sq: `G3:G${elL}`, f: '"Paid,Unpaid"' },
      { sq: `H3:H${elL}`, f: `Masters!$G$3:$G$${mstL}` }]
    }));

  /* ---------- Vendor Payment ---------- */
  if (m.vendor !== false) {
    sheets.push(logSheet('Vendor Payment',
      ['Sr No', 'Date', 'Vendor', 'Amount (Rs)', 'Paid By', 'Mode', 'Remark', 'Ya vendor la ekun dilele'],
      [7, 13, 22, 14, 13, 14, 24, 18], vp,
      (r, n) => [
        F_(`IF($B${n}="","",COUNTA($B$3:$B${n}))`, SY.int),
        r ? D_(r.date) : E_,
        r ? T(r.vendor) : T('', SY.txt),
        r && has(r.amount) ? N_(num(r.amount)) : E_,
        r ? T(r.paidBy) : T('', SY.txt),
        r ? T(r.mode) : T('', SY.txt),
        r ? T(r.remark) : T('', SY.txt),
        F_(`IF($C${n}="","",SUMIF($C$3:$C${n},$C${n},$D$3:$D${n}))`)
      ],
      {
        dv: [{ sq: `C3:C${vpL}`, f: `Masters!$C$3:$C$${mstL}` },
        { sq: `E3:E${vpL}`, f: `Masters!$G$3:$G$${mstL}` }]
      }));
  }

  /* ---------- Owner Payment ---------- */
  if (m.owner) {
    sheets.push(logSheet('Owner Payment',
      ['Sr No', 'Date', 'Machine Owner', 'Amount (Rs)', 'Paid By', 'Mode', 'Remark'],
      [7, 13, 22, 14, 13, 14, 26], op,
      (r, n) => [
        F_(`IF($B${n}="","",COUNTA($B$3:$B${n}))`, SY.int),
        r ? D_(r.date) : E_, r ? T(r.owner) : T('', SY.txt),
        r && has(r.amount) ? N_(num(r.amount)) : E_,
        r ? T(r.paidBy) : T('', SY.txt), r ? T(r.mode) : T('', SY.txt), r ? T(r.remark) : T('', SY.txt)
      ],
      { dv: [{ sq: `E3:E${opL}`, f: `Masters!$G$3:$G$${mstL}` }] }));
  }

  /* ---------- Paise Milale ---------- */
  if (m.funds) {
    sheets.push(logSheet('Paise Milale',
      ['Sr No', 'Date', 'Naav', 'Amount (Rs)', 'Kunakadun', 'Mode', 'Remark'],
      [7, 13, 18, 14, 18, 14, 26], fn,
      (r, n) => [
        F_(`IF($B${n}="","",COUNTA($B$3:$B${n}))`, SY.int),
        r ? D_(r.date) : E_, r ? T(r.person) : T('', SY.txt),
        r && has(r.amount) ? N_(num(r.amount)) : E_,
        r ? T(r.from) : T('', SY.txt), r ? T(r.mode) : T('', SY.txt), r ? T(r.remark) : T('', SY.txt)
      ],
      { dv: [{ sq: `C3:C${fnL}`, f: `Masters!$G$3:$G$${mstL}` }] }));
  }

  /* ---------- Machine Rent ---------- */
  if (m.machine !== false) {
    const rows = [];
    rows[0] = [T(s.name + '  \u2014  Machine Rent', SY.title)];
    rows[1] = ['Machine No', 'Type', 'Owner', 'Rate Basis', 'Package Rate', 'Units', 'Rate per Hr/Day', 'Total Hr / Days', 'Rent (Rs)'].map(c => T(c, SY.col));
    s.machines.forEach((mc, i) => {
      const n = i + 3;
      rows[n - 1] = [
        T(mc.no), T(mc.type), T(mc.owner),
        F_(`IFERROR(INDEX('Rate Master'!$B$3:$B$${rmL},MATCH($B${n},'Rate Master'!$A$3:$A$${rmL},0)),"")`, SY.txt),
        F_(`IFERROR(IF(N(INDEX('Machine Master'!$G$3:$G$${mmL},MATCH($A${n},'Machine Master'!$B$3:$B$${mmL},0)))>0,INDEX('Machine Master'!$G$3:$G$${mmL},MATCH($A${n},'Machine Master'!$B$3:$B$${mmL},0)),INDEX('Rate Master'!$C$3:$C$${rmL},MATCH($B${n},'Rate Master'!$A$3:$A$${rmL},0))),0)`),
        F_(`IFERROR(INDEX('Rate Master'!$D$3:$D$${rmL},MATCH($B${n},'Rate Master'!$A$3:$A$${rmL},0)),1)`, SY.int),
        F_(`IF(N($F${n})=0,0,$E${n}/$F${n})`, SY.dec2),
        F_(`IF($D${n}="Daily",COUNTIF('Machine Log'!$C$3:$C$${mlL},$A${n}),SUMIF('Machine Log'!$C$3:$C$${mlL},$A${n},'Machine Log'!$G$3:$G$${mlL}))`, SY.dec1),
        F_(`$G${n}*$H${n}`)
      ];
    });
    const tr = s.machines.length + 3;
    rows[tr - 1] = [T('TOTAL', SY.bold), T('', SY.bold), T('', SY.bold), T('', SY.bold), T('', SY.bold), T('', SY.bold), T('', SY.bold),
      F_(SUMR('H', 3, tr - 1), SY.tot), F_(SUMR('I', 3, tr - 1), SY.tot)];
    sheets.push({ name: 'Machine Rent', freeze: 2, cols: [13, 12, 18, 11, 13, 8, 14, 14, 14], rows, merges: ['A1:I1'], heights: { 1: 26, 2: 28 } });
  }

  /* ---------- Machine Master ---------- */
  if (m.machine !== false) {
    const rows = [];
    rows[0] = [T(s.name + '  \u2014  Machine Master', SY.title)];
    rows[1] = ['Sr No', 'Machine No', 'Machine Type', 'Owner Name', 'Operator Name', 'Make', 'Ya machine cha rate'].map(c => T(c, SY.col));
    for (let i = 0; i < s.machines.length + 50; i++) {
      const mc = s.machines[i], n = i + 3;
      rows[n - 1] = [F_(`IF($B${n}="","",COUNTA($B$3:$B${n}))`, SY.int),
        mc ? T(mc.no) : T('', SY.txt), mc ? T(mc.type) : T('', SY.txt), mc ? T(mc.owner) : T('', SY.txt),
        mc ? T(mc.operator) : T('', SY.txt), mc ? T(mc.make) : T('', SY.txt),
        mc && has(mc.monthlyRate) && num(mc.monthlyRate) ? N_(num(mc.monthlyRate)) : E_];
    }
    sheets.push({
      name: 'Machine Master', freeze: 2, cols: [7, 14, 14, 20, 20, 16, 18], rows, merges: ['A1:G1'], heights: { 1: 26, 2: 28 },
      dv: [{ sq: `C3:C${mmL}`, f: `'Rate Master'!$A$3:$A$${rmL}` }]
    });

    /* ---------- Rate Master ---------- */
    const rr = [];
    rr[0] = [T('Rate Master  \u2014  machine type nusar rate', SY.title)];
    rr[1] = ['Machine Type', 'Rate Basis', 'Package Rate (Rs)', 'Package Units', 'Rate per Hr / Day'].map(c => T(c, SY.col));
    for (let i = 0; i < s.rateMaster.length + 10; i++) {
      const r = s.rateMaster[i], n = i + 3;
      rr[n - 1] = [r ? T(r.type) : T('', SY.txt), r ? T(r.basis) : T('', SY.txt),
        r && num(r.packageRate) ? N_(num(r.packageRate)) : E_,
        r ? N_(num(r.packageUnits) || 1, SY.int) : E_,
        F_(`IF(OR($C${n}="",$D${n}=""),"",$C${n}/$D${n})`, SY.dec2)];
    }
    rr[s.rateMaster.length + 4] = [T('Hourly = rate 240 hours sathi. Daily = rate 30 divsansathi (Hiwa). Ithe rate badalla ki sagle rent apoap badaltat.', SY.note)];
    sheets.push({
      name: 'Rate Master', freeze: 2, cols: [16, 12, 18, 14, 18], rows: rr, merges: ['A1:E1'], heights: { 1: 26, 2: 28 },
      dv: [{ sq: `B3:B${rmL}`, f: '"Hourly,Daily"' }]
    });
  }

  /* ---------- Masters ---------- */
  {
    const rows = [];
    rows[0] = [T(s.name + '  \u2014  Masters (dropdown lists)', SY.title)];
    rows[1] = ['Expense Category', '', 'Vendor', '', 'Diesel Vendor', '', 'Paid By (naav)'].map((c, i) => T(c, i % 2 === 0 ? SY.col : SY.col));
    const maxn = mstL - 2;
    for (let i = 0; i < maxn; i++) {
      const n = i + 3;
      rows[n - 1] = [
        s.categories[i] ? T(s.categories[i]) : T('', SY.txt), E_,
        s.vendors[i] ? T(s.vendors[i]) : T('', SY.txt), E_,
        s.dieselVendors[i] ? T(s.dieselVendors[i]) : T('', SY.txt), E_,
        s.people[i] ? T(s.people[i]) : T('', SY.txt)
      ];
    }
    sheets.push({ name: 'Masters', freeze: 2, cols: [24, 2, 24, 2, 22, 2, 18], rows, merges: ['A1:G1'], heights: { 1: 26, 2: 28 } });
  }

  /* ---------- Manager Account ---------- */
  {
    const rows = [];
    rows[0] = [T(s.name + '  \u2014  Manager Account', SY.title)];
    const head = ['Naav'].concat(m.funds ? ['Paise Milale'] : [], ['Site Expense'], m.murum ? ['Murum'] : [], m.diesel !== false ? ['Diesel'] : [],
      m.vendor !== false ? ['Vendor Payment'] : [], m.owner ? ['Owner Payment'] : [], ['Total Kharch'], m.funds ? ['Shillak'] : []);
    rows[1] = head.map(c => T(c, SY.col));
    const first = 3;
    s.people.forEach((p, i) => {
      const n = i + first, cells = [T(p)];
      const parts = [];
      if (m.funds) cells.push(F_(`SUMIF('Paise Milale'!$C$3:$C$${fnL},$A${n},'Paise Milale'!$D$3:$D$${fnL})`));
      cells.push(F_(`SUMIFS('Expense Log'!$F$3:$F$${elL},'Expense Log'!$H$3:$H$${elL},$A${n},'Expense Log'!$G$3:$G$${elL},"Paid")`)); parts.push('C');
      if (m.murum) { parts.push(colL(cells.length + 1)); cells.push(F_(`SUMIFS('Murum Log'!$F$3:$F$${muL},'Murum Log'!$H$3:$H$${muL},$A${n},'Murum Log'!$G$3:$G$${muL},"Paid")`)); }
      if (m.diesel !== false) { parts.push(colL(cells.length + 1)); cells.push(F_(`SUMIFS('Diesel Purchase'!$F$3:$F$${dlL},'Diesel Purchase'!$H$3:$H$${dlL},$A${n},'Diesel Purchase'!$G$3:$G$${dlL},"Paid")`)); }
      if (m.vendor !== false) { parts.push(colL(cells.length + 1)); cells.push(F_(`SUMIF('Vendor Payment'!$E$3:$E$${vpL},$A${n},'Vendor Payment'!$D$3:$D$${vpL})`)); }
      if (m.owner) { parts.push(colL(cells.length + 1)); cells.push(F_(`SUMIF('Owner Payment'!$E$3:$E$${opL},$A${n},'Owner Payment'!$D$3:$D$${opL})`)); }
      const expCol = colL(m.funds ? 3 : 2);
      const lastSpend = colL(cells.length);
      cells.push(F_(`SUM(${expCol}${n}:${lastSpend}${n})`, SY.tot));
      if (m.funds) {
        const totCol = colL(cells.length);
        const gotCol = 'B';
        cells.push((s.advance || []).includes(p) ? F_(`${gotCol}${n}-${totCol}${n}`, SY.tot) : T('—', SY.txt));
      }
      rows[n - 1] = cells;
    });
    const tr = s.people.length + first;
    rows[tr - 1] = head.map((h, i) => i === 0 ? T('TOTAL', SY.bold) : F_(SUMR(colL(i + 1), first, tr - 1), SY.tot));
    rows[tr + 1] = [T('Shillak = paise milale \u2212 ekun kharch. Jyanna advance milat nahi tyanchya samor "—" asto.', SY.note)];
    sheets.push({ name: 'Manager Account', freeze: 2, cols: [18].concat(head.slice(1).map(() => 15)), rows, merges: ['A1:' + colL(head.length) + '1'], heights: { 1: 26, 2: 28 } });
  }

  /* ---------- Dashboard (pahili sheet) ---------- */
  {
    const rows = [];
    const W = 6;
    rows[0] = [T(s.name + '  \u2014  Site Dashboard', SY.title)];
    rows[1] = [T('Ha dashboard apoap update hoto. Khalchya sheets madhe entry kara.', SY.note)];

    const exp = `SUM('Expense Log'!$F$3:$F$${elL})`;
    const dsl = m.diesel !== false ? `SUM('Diesel Purchase'!$F$3:$F$${dlL})` : '0';
    const mur = m.murum ? `SUM('Murum Log'!$F$3:$F$${muL})` : '0';
    const rent = m.machine !== false ? `SUM('Machine Rent'!$I$3:$I$${mrL})` : '0';
    const vpay = m.vendor !== false ? `SUM('Vendor Payment'!$D$3:$D$${vpL})` : '0';
    const expP = `SUMIF('Expense Log'!$G$3:$G$${elL},"Paid",'Expense Log'!$F$3:$F$${elL})`;
    const expU = `SUMIF('Expense Log'!$G$3:$G$${elL},"Unpaid",'Expense Log'!$F$3:$F$${elL})`;
    const dslP = m.diesel !== false ? `SUMIF('Diesel Purchase'!$G$3:$G$${dlL},"Paid",'Diesel Purchase'!$F$3:$F$${dlL})` : '0';
    const dslU = m.diesel !== false ? `SUMIF('Diesel Purchase'!$G$3:$G$${dlL},"Unpaid",'Diesel Purchase'!$F$3:$F$${dlL})` : '0';
    const murP = m.murum ? `SUMIF('Murum Log'!$G$3:$G$${muL},"Paid",'Murum Log'!$F$3:$F$${muL})` : '0';
    const murU = m.murum ? `SUMIF('Murum Log'!$G$3:$G$${muL},"Unpaid",'Murum Log'!$F$3:$F$${muL})` : '0';

    rows[3] = [T('TOTAL PLOT EXPENSE', SY.kpiL), E_, T('PAID', SY.kpiL), E_, T('NET PENDING', SY.kpiL)];
    rows[4] = [F_(`${exp}+${dsl}+${mur}+${rent}`, SY.kpiV), E_, F_(`${expP}+${dslP}+${murP}+${vpay}`, SY.kpiV), E_, F_(`(${expU}+${dslU}+${murU})-${vpay}`, SY.kpiV)];

    rows[6] = [T('EXPENSE HEAD-WISE', SY.head), T('', SY.head), T('', SY.head), T('', SY.head)];
    rows[7] = ['Head', 'Total (Rs)', 'Paid (Rs)', 'Pending (Rs)'].map(c => T(c, SY.col));
    let r = 9;
    const line = (label, tot, paid, pend) => { rows[r - 1] = [T(label), F_(tot), F_(paid), F_(pend)]; r++; };
    line('Site Expense', exp, expP, expU);
    if (m.murum) line('Murum', mur, murP, murU);
    if (m.diesel !== false) line('Diesel Purchase', dsl, dslP, dslU);
    if (m.vendor !== false) line('Less: Vendor Payments', '0', vpay, `-${vpay}`);
    rows[r - 1] = [T('NET (rent sodun)', SY.bold), F_(SUMR('B', 9, r - 1), SY.tot), F_(SUMR('C', 9, r - 1), SY.tot), F_(SUMR('D', 9, r - 1), SY.tot)];
    r += 2;

    if (m.machine !== false) {
      const opSum = m.owner ? `SUM('Owner Payment'!$D$3:$D$${opL})` : '0';
      rows[r - 1] = [T('MACHINE RENT', SY.head), T('', SY.head), T('', SY.head), T('', SY.head)]; r++;
      rows[r - 1] = ['Rent payable (Rs)', 'Owner la dilele (Rs)', 'Baki (Rs)', ''].map(c => T(c, SY.col)); r++;
      rows[r - 1] = [F_(rent), F_(opSum), F_(`${rent}-${opSum}`, SY.tot)]; r += 2;
    }

    rows[r - 1] = [T('CATEGORY-WISE SITE EXPENSE', SY.head), T('', SY.head), T('', SY.head), T('', SY.head)]; r++;
    rows[r - 1] = ['Category', 'Total (Rs)', 'Paid (Rs)', 'Entries'].map(c => T(c, SY.col)); r++;
    const catStart = r;
    s.categories.forEach(c => {
      const n = r;
      rows[n - 1] = [T(c),
        F_(`SUMIF('Expense Log'!$C$3:$C$${elL},$A${n},'Expense Log'!$F$3:$F$${elL})`),
        F_(`SUMIFS('Expense Log'!$F$3:$F$${elL},'Expense Log'!$C$3:$C$${elL},$A${n},'Expense Log'!$G$3:$G$${elL},"Paid")`),
        F_(`COUNTIF('Expense Log'!$C$3:$C$${elL},$A${n})`, SY.int)];
      r++;
    });
    rows[r - 1] = [T('TOTAL', SY.bold), F_(SUMR('B', catStart, r - 1), SY.tot), F_(SUMR('C', catStart, r - 1), SY.tot), F_(SUMR('D', catStart, r - 1), SY.tot)];
    r += 2;

    if (m.vendor !== false) {
      rows[r - 1] = [T('VENDOR-WISE UDHAARI', SY.head), T('', SY.head), T('', SY.head), T('', SY.head), T('', SY.head)]; r++;
      rows[r - 1] = ['Vendor', 'Ekun kaam (Rs)', 'Direct paid (Rs)', 'Payment kele (Rs)', 'Baki (Rs)'].map(c => T(c, SY.col)); r++;
      const vs = r;
      s.vendors.forEach(v => {
        const n = r;
        const totF = `SUMIF('Expense Log'!$E$3:$E$${elL},$A${n},'Expense Log'!$F$3:$F$${elL})` + (m.murum ? `+SUMIF('Murum Log'!$C$3:$C$${muL},$A${n},'Murum Log'!$F$3:$F$${muL})` : '');
        const dirF = `SUMIFS('Expense Log'!$F$3:$F$${elL},'Expense Log'!$E$3:$E$${elL},$A${n},'Expense Log'!$G$3:$G$${elL},"Paid")` + (m.murum ? `+SUMIFS('Murum Log'!$F$3:$F$${muL},'Murum Log'!$C$3:$C$${muL},$A${n},'Murum Log'!$G$3:$G$${muL},"Paid")` : '');
        rows[n - 1] = [T(v), F_(totF), F_(dirF),
          F_(`SUMIF('Vendor Payment'!$C$3:$C$${vpL},$A${n},'Vendor Payment'!$D$3:$D$${vpL})`),
          F_(`$B${n}-$C${n}-$D${n}`, SY.tot)];
        r++;
      });
      rows[r - 1] = [T('TOTAL', SY.bold), F_(SUMR('B', vs, r - 1), SY.tot), F_(SUMR('C', vs, r - 1), SY.tot), F_(SUMR('D', vs, r - 1), SY.tot), F_(SUMR('E', vs, r - 1), SY.tot)];
      r += 2;
    }

    if (m.diesel !== false) {
      rows[r - 1] = [T('DIESEL VENDOR-WISE', SY.head), T('', SY.head), T('', SY.head), T('', SY.head)]; r++;
      rows[r - 1] = ['Diesel Vendor', 'Litres', 'Amount (Rs)', 'Unpaid (Rs)'].map(c => T(c, SY.col)); r++;
      s.dieselVendors.forEach(v => {
        const n = r;
        rows[n - 1] = [T(v),
          F_(`SUMIF('Diesel Purchase'!$C$3:$C$${dlL},$A${n},'Diesel Purchase'!$D$3:$D$${dlL})`, SY.dec1),
          F_(`SUMIF('Diesel Purchase'!$C$3:$C$${dlL},$A${n},'Diesel Purchase'!$F$3:$F$${dlL})`),
          F_(`SUMIFS('Diesel Purchase'!$F$3:$F$${dlL},'Diesel Purchase'!$C$3:$C$${dlL},$A${n},'Diesel Purchase'!$G$3:$G$${dlL},"Unpaid")`)];
        r++;
      });
      r += 1;
    }

    if (m.machine !== false) {
      rows[r - 1] = [T('MACHINE SUMMARY', SY.head), T('', SY.head), T('', SY.head), T('', SY.head)]; r++;
      rows[r - 1] = ['Total machines', 'Log entries', 'Total hours', 'Diesel used (L)'].map(c => T(c, SY.col)); r++;
      rows[r - 1] = [F_(`COUNTA('Machine Master'!$B$3:$B$${mmL})`, SY.int),
        F_(`COUNTA('Machine Log'!$C$3:$C$${mlL})`, SY.int),
        F_(`SUM('Machine Log'!$G$3:$G$${mlL})`, SY.dec1),
        F_(`SUM('Machine Log'!$H$3:$H$${mlL})`, SY.dec1)];
      r += 2;
    }

    sheets.unshift({ name: 'Dashboard', tabSelected: true, cols: [30, 18, 18, 18, 18, 14], rows, merges: ['A1:F1', 'A2:F2', 'A4:B4', 'A5:B5', 'C4:D4', 'C5:D5'], heights: { 1: 30, 5: 24 } });
  }

  return sheets;
}

function xlsxBytes(s) {
  const sheets = buildWorkbook(s);
  const files = [];
  const ct = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">',
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>',
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>',
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'];
  sheets.forEach((sh, i) => ct.push(`<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`));
  ct.push('</Types>');
  files.push({ name: '[Content_Types].xml', data: ENC.encode(ct.join('')) });
  files.push({ name: '_rels/.rels', data: ENC.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>') });
  const wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
    sheets.map((sh, i) => `<sheet name="${X(sh.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') +
    '</sheets><calcPr calcId="171027" fullCalcOnLoad="1"/></workbook>';
  files.push({ name: 'xl/workbook.xml', data: ENC.encode(wb) });
  const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    sheets.map((sh, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +
    `<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  files.push({ name: 'xl/_rels/workbook.xml.rels', data: ENC.encode(rels) });
  files.push({ name: 'xl/styles.xml', data: ENC.encode(STYLES_XML) });
  sheets.forEach((sh, i) => files.push({ name: `xl/worksheets/sheet${i + 1}.xml`, data: ENC.encode(sheetXml(sh)) }));
  return zipStore(files);
}

function exportExcel(s) {
  try {
    const bytes = xlsxBytes(s);
    const name = s.name.replace(/[^\w]+/g, '_') + '_Account_' + today() + '.xlsx';
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
    toast('Excel file download zali');
  } catch (e) { console.error(e); toast('Excel banavtana problem ala'); }
}

function machineBill(s, no) {

  const lph = r.hours ? r.diesel / r.hours : 0;
  return `<div class="bill">

      (m.make ? '<br>Make: ' + esc(m.make) : ''))}
    ${kpi([
      ['TOTAL ENTRIES', r.entries],
      ['TOTAL HOURS', dec(r.hours)],
      ['TOTAL DIESEL (L)', dec(r.diesel)],
      (() => { const o = rows.reduce((a, x) => a + num(x.openDiesel), 0); return o ? ['OPENING DIESEL (L)', dec(o)] : null; })(),
      ['DIESEL PER HOUR', lph ? dec(lph, 2) + ' L' : '-'],
      r.unit ? ['RATE / ' + (r.basis === 'Daily' ? 'DAY' : 'HR'), dec(r.unit, 0)] : null,
      r.rent ? ['RENT PAYABLE', money0(r.rent)] : null
    ])}
    <h2>All entries</h2>
    <table>
      <thead><tr><th>Sr</th><th>Date</th><th class="n">In reading</th><th class="n">Out reading</th><th class="n">Hours</th><th class="n">Diesel (L)</th><th class="n">L / hr</th><th>Remark</th></tr></thead>
      <tbody>${rows.map((x, i) => {
        const h = hoursOf(x), d = num(x.diesel);
        return `<tr><td class="n">${i + 1}</td><td>${fmtDate(x.date)}</td>
          <td class="n">${has(x.inR) ? dec(x.inR, 1) : '-'}</td>
          <td class="n">${has(x.outR) ? dec(x.outR, 1) : '-'}</td>
          <td class="n">${h ? dec(h) : '-'}</td>
          <td class="n">${d ? dec(d) : '-'}</td>
          <td class="n">${(h && d) ? dec(d / h, 2) : '-'}</td>

      }).join('') || '<tr><td colspan="8">No entries</td></tr>'}</tbody>
      <tfoot><tr><td colspan="4">TOTAL</td><td class="n">${dec(r.hours)}</td><td class="n">${dec(r.diesel)}</td><td class="n">${lph ? dec(lph, 2) : '-'}</td><td></td></tr></tfoot>
    </table>
    <div class="sign"><div>Prepared by ______________</div><div>Checked by ______________</div></div>
  </div>`;
}

/* ---------------- VENDOR BILL ---------------- */
function vendorBill(s, v) {
  const dv = isDieselVendor(s, v);
  const x = dv ? dieselVendorStats(s, v) : vendorStats(s, v);
  const fin = settle(s);
  const total = dv ? x.amount : x.total;
  const direct = x.direct || 0;
  const payments = dv ? x.payments : x.paid;
  const remaining = x.remaining;

  /* saglya nondi ekatra, date pramane */
  let items = [];
  s.expenseLog.filter(e => e.vendor === v).forEach(e => items.push({
    date: e.date, kind: e.category || 'Expense', desc: e.desc || '', qty: '',
    amount: num(e.amount), f: fin[e.id] || {}
  }));
  (s.murumLog || []).filter(m => m.vendor === v).forEach(m => items.push({
    date: m.date, kind: 'Murum', desc: m.remark || '', qty: dec(m.qty) + ' ' + (s.murumUnit || 'Brass'),
    amount: mAmt(m), f: fin[m.id] || {}
  }));
  (s.dieselLog || []).filter(d => d.vendor === v).forEach(d => items.push({
    date: d.date, kind: 'Diesel', desc: d.bill ? 'Bill ' + d.bill : '', qty: dec(d.litres) + ' L',
    amount: num(d.amount), f: fin[d.id] || {}
  }));
  items.sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const pays = (s.vendorPayments || []).filter(p => p.vendor === v)
    .slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));

  const row = it => `<tr><td>${fmtDate(it.date)}</td><td>${esc(it.kind)}</td><td>${esc(it.desc)}${it.qty ? ' <span style="color:#555">(' + it.qty + ')</span>' : ''}</td>
    <td class="n">${money0(it.amount)}</td>
    <td class="n">${it.f.alloc > 0.5 ? money0(it.f.alloc) : (it.f.final === 'Paid' ? money0(it.amount) : '-')}</td>
    <td class="n">${it.f.final === 'Paid' ? '0' : money0(it.f.bal != null ? it.f.bal : it.amount)}</td>
    <td>${it.f.final === 'Paid' ? 'Paid' + (it.f.by ? ' (' + esc(it.f.by) + ')' : '') : (it.f.alloc > 0.5 ? 'Part paid' : 'Unpaid')}</td></tr>`;

  const paidItems = items.filter(it => it.f.final === 'Paid');
  const dueItems = items.filter(it => it.f.final !== 'Paid');

  return `<div class="bill">
    ${billHead('Vendor Statement  -  ' + v, dv ? 'Diesel vendor' : 'Site vendor')}
    ${kpi([
      ['TOTAL AMOUNT', money0(total)],
      ['DIRECT PAID', money0(direct)],
      ['PAYMENTS MADE', money0(payments)],
      ['TOTAL PAID', money0(direct + payments)],
      ['REMAINING DUE', money0(remaining)]
    ])}

    <h2>Payments made (date wise)</h2>
    <table>
      <thead><tr><th>Date</th><th>Paid by</th><th>Mode</th><th>Remark</th><th class="n">Amount</th></tr></thead>
      <tbody>${pays.map(p => `<tr><td>${fmtDate(p.date)}</td><td>${esc(p.paidBy || '-')}</td><td>${esc(p.mode || '-')}</td><td>${esc(p.remark || '')}</td><td class="n">${money0(p.amount)}</td></tr>`).join('')
        || '<tr><td colspan="5">No payments recorded</td></tr>'}</tbody>
      <tfoot><tr><td colspan="4">TOTAL PAYMENTS</td><td class="n">${money0(payments)}</td></tr></tfoot>
    </table>

    <h2>Pending entries (${dueItems.length})</h2>
    <table>
      <thead><tr><th>Date</th><th>Head</th><th>Details</th><th class="n">Amount</th><th class="n">Paid</th><th class="n">Balance</th><th>Status</th></tr></thead>
      <tbody>${dueItems.map(row).join('') || '<tr><td colspan="7">Nothing pending</td></tr>'}</tbody>
      <tfoot><tr><td colspan="3">TOTAL PENDING</td>
        <td class="n">${money0(dueItems.reduce((a, i) => a + i.amount, 0))}</td>
        <td class="n">${money0(dueItems.reduce((a, i) => a + (i.f.alloc || 0), 0))}</td>
        <td class="n">${money0(dueItems.reduce((a, i) => a + (i.f.bal != null ? i.f.bal : i.amount), 0))}</td><td></td></tr></tfoot>
    </table>

    <h2>Paid entries (${paidItems.length})</h2>
    <table>
      <thead><tr><th>Date</th><th>Head</th><th>Details</th><th class="n">Amount</th><th class="n">Paid</th><th class="n">Balance</th><th>Status</th></tr></thead>
      <tbody>${paidItems.map(row).join('') || '<tr><td colspan="7">None</td></tr>'}</tbody>
      <tfoot><tr><td colspan="3">TOTAL PAID</td><td class="n">${money0(paidItems.reduce((a, i) => a + i.amount, 0))}</td><td class="n"></td><td class="n">0</td><td></td></tr></tfoot>
    </table>

    <table>
      <tbody>
        <tr><th>Total work / bills</th><td class="n">${money0(total)}</td></tr>
        <tr><th>Total paid (direct + payments)</th><td class="n">${money0(direct + payments)}</td></tr>
        <tr><th>REMAINING DUE</th><td class="n"><b>${money0(remaining)}</b></td></tr>
      </tbody>
    </table>
    <div class="sign"><div>Vendor signature ______________</div><div>For ${esc(site().name)} ______________</div></div>
  </div>`;
}

/* ---------- simple lists ---------- */
function listForm(s, key, idx) {
  const cur = idx == null ? '' : s[key][idx];
  const titles = { categories: 'Category', people: 'Name', vendors: 'Vendor', dieselVendors: 'Diesel vendor' };
  openSheet((idx == null ? 'New ' : 'Edit ') + titles[key], `
    <div class="card"><div class="pad"><div class="field"><label>${titles[key]}</label><input id="f_v" value="${esc(cur)}"></div></div></div>`,
    () => {
      const v = val('f_v'); if (!v) return toast('Enter a name');
      if (idx == null) { if (s[key].includes(v)) return toast('Already in the list'); s[key].push(v); }
      else {
        const old = s[key][idx]; s[key][idx] = v;
        if (old !== v) {
          if (key === 'categories') s.expenseLog.forEach(e => { if (e.category === old) e.category = v; });
          if (key === 'vendors') { s.expenseLog.forEach(e => { if (e.vendor === old) e.vendor = v; }); s.vendorPayments.forEach(p => { if (p.vendor === old) p.vendor = v; }); }
          if (key === 'dieselVendors') s.dieselLog.forEach(d => { if (d.vendor === old) d.vendor = v; });
          if (key === 'people') { [s.expenseLog, s.dieselLog].forEach(l => l.forEach(r => { if (r.paidBy === old) r.paidBy = v; })); s.vendorPayments.forEach(p => { if (p.paidBy === old) p.paidBy = v; }); }
        }
      }
      return true;
    },
    idx == null ? null : () => { s[key].splice(idx, 1); });
}

/* ---------- company cha logo ---------- */
function pickLogo() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onerror = () => alert('Image vachta ali nahi.');
    rd.onload = () => {
      const img = new Image();
      img.onerror = () => alert('Hi image ughadta ali nahi.');
      img.onload = async () => {
        try {
          const MW = 320, MH = 110;
          let w = img.width, h = img.height;
          const sc = Math.min(MW / w, MH / h, 1);
          w = Math.max(1, Math.round(w * sc)); h = Math.max(1, Math.round(h * sc));
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          DB.logo = c.toDataURL('image/png');
          await save(); render(); toast('Logo lavla');
        } catch (e) { alert('Logo thevta ala nahi.'); }
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}
